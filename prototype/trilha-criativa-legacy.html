<title>Trilha Criativa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: fixed 240px sidebar + 72px top bar + 32px-padded workspace; contextual action bar docks to the bottom of the workspace. */
:root {
  --bg: #F6F5F2;
  --surface: #FFFFFF;
  --surface-2: #F1F0EC;
  --border: #E3E1DA;
  --border-strong: #CBC8BF;
  --text: #1E2027;
  --text-2: #464953;
  --text-3: #686B74;
  --accent: #4338CA;
  --accent-hover: #3730A3;
  --accent-soft: #EEEFFD;
  --accent-text: #3730A3;
  --on-accent: #FFFFFF;
  --fact: #0B6E66;
  --fact-soft: #E3F3F0;
  --fact-border: #9FD3CB;
  --ai: #8A5800;
  --ai-soft: #FBF2DE;
  --ai-border: #E9C98A;
  --question: #0B5F8F;
  --question-soft: #E4F1F9;
  --question-border: #9ECBE6;
  --warn: #B4400D;
  --warn-soft: #FEF0E7;
  --danger: #B42318;
  --danger-soft: #FCEBE9;
  --success: #15703A;
  --success-soft: #E6F4EB;
  --discard: #72757D;
  --discard-soft: #EFEEEA;
  --overlay: rgba(22, 22, 30, 0.44);
  --shadow: 0 1px 2px rgba(24, 24, 36, 0.05);
  --shadow-lg: 0 16px 48px rgba(24, 24, 36, 0.18);
  --slide-bg: #FFFFFF;
  --slide-ink: #1E2027;
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 12px;
  --r-sm: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141519; --surface: #1C1D22; --surface-2: #24252B; --border: #32343C; --border-strong: #454852;
    --text: #ECEDF0; --text-2: #C4C6CC; --text-3: #9B9EA6;
    --accent: #8C90F6; --accent-hover: #A5A8F8; --accent-soft: #25274A; --accent-text: #B5B8FB; --on-accent: #14152B;
    --fact: #57C7B8; --fact-soft: #15302C; --fact-border: #2C5E57;
    --ai: #E4B75E; --ai-soft: #302713; --ai-border: #65512A;
    --question: #71BCE8; --question-soft: #142936; --question-border: #2C5572;
    --warn: #F29A66; --warn-soft: #382216; --danger: #F28B82; --danger-soft: #3A1D1B;
    --success: #6FD295; --success-soft: #16301F; --discard: #9B9EA6; --discard-soft: #25262B;
    --overlay: rgba(0, 0, 0, 0.62); --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 16px 48px rgba(0,0,0,.5);
    --slide-bg: #F7F6F2; --slide-ink: #1E2027;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141519; --surface: #1C1D22; --surface-2: #24252B; --border: #32343C; --border-strong: #454852;
  --text: #ECEDF0; --text-2: #C4C6CC; --text-3: #9B9EA6;
  --accent: #8C90F6; --accent-hover: #A5A8F8; --accent-soft: #25274A; --accent-text: #B5B8FB; --on-accent: #14152B;
  --fact: #57C7B8; --fact-soft: #15302C; --fact-border: #2C5E57;
  --ai: #E4B75E; --ai-soft: #302713; --ai-border: #65512A;
  --question: #71BCE8; --question-soft: #142936; --question-border: #2C5572;
  --warn: #F29A66; --warn-soft: #382216; --danger: #F28B82; --danger-soft: #3A1D1B;
  --success: #6FD295; --success-soft: #16301F; --discard: #9B9EA6; --discard-soft: #25262B;
  --overlay: rgba(0, 0, 0, 0.62); --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 16px 48px rgba(0,0,0,.5);
  --slide-bg: #F7F6F2; --slide-ink: #1E2027;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button, input, textarea, select { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.boot { padding: 48px; color: var(--text-3); }

/* Shell */
.app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100%; }
.sidebar { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 24px; padding: 20px 16px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px; }
.brand-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--text); color: var(--bg); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.brand-name { font-weight: 700; letter-spacing: -0.01em; }
.brand-sub { font-size: 11px; color: var(--text-3); }
.nav-label { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-3); padding: 0 8px; margin-bottom: 6px; }
.nav-list { display: flex; flex-direction: column; gap: 2px; list-style: none; margin: 0; padding: 0; }
.nav-item { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px; border: 0; background: transparent; border-radius: var(--r-sm); cursor: pointer; text-align: left; color: var(--text-2); font-weight: 500; }
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item[aria-current="page"] { background: var(--accent-soft); color: var(--accent-text); }
.nav-item .stage-num { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--border-strong); display: grid; place-items: center; font-size: 11px; color: var(--text-3); flex: none; font-variant-numeric: tabular-nums; }
.nav-item .stage-num.done { background: var(--text); border-color: var(--text); color: var(--bg); }
.nav-item .stage-num.current { border: 2px solid var(--accent); color: var(--accent-text); font-weight: 700; }
.nav-item .nav-meta { margin-left: auto; font-size: 11px; color: var(--text-3); }
.job-ctx { border: 1px solid var(--border); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--bg); }
.job-ctx-title { font-weight: 600; font-size: 13px; }
.job-ctx-client { font-size: 12px; color: var(--text-3); }
.sidebar-foot { margin-top: auto; font-size: 11px; color: var(--text-3); padding: 0 8px; }

.main { display: flex; flex-direction: column; min-width: 0; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 32px; background: var(--surface); border-bottom: 1px solid var(--border); }
.crumbs { display: flex; align-items: center; gap: 8px; color: var(--text-3); min-width: 0; flex-wrap: wrap; }
.crumbs button { background: none; border: 0; padding: 2px 4px; cursor: pointer; color: var(--text-2); border-radius: 6px; }
.crumbs button:hover { color: var(--text); text-decoration: underline; }
.crumbs .here { color: var(--text); font-weight: 600; }
.top-actions { display: flex; align-items: center; gap: 12px; flex: none; }
.saved { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-3); }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); display: grid; place-items: center; font-weight: 600; font-size: 12px; }
.content { padding: 32px; flex: 1; min-width: 0; }
.content-inner { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

/* Page header */
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
.page-head-text { display: flex; flex-direction: column; gap: 6px; min-width: 0; max-width: 680px; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-3); }
h1 { font-size: 24px; line-height: 1.25; font-weight: 700; letter-spacing: -0.015em; }
h2 { font-size: 16px; font-weight: 600; }
h3 { font-size: 15px; font-weight: 600; line-height: 1.35; }
.lede { color: var(--text-2); max-width: 65ch; }
.muted { color: var(--text-3); }
.small { font-size: 12px; }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-start; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: var(--r-sm); border: 1px solid transparent; font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s, color .12s; }
.btn-sm { height: 30px; padding: 0 10px; font-size: 12px; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn-secondary { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
.btn-secondary:hover:not(:disabled) { background: var(--surface-2); }
.btn-tertiary { background: transparent; color: var(--text-2); }
.btn-tertiary:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover:not(:disabled) { filter: brightness(0.93); }
.btn-ai { background: var(--ai-soft); color: var(--ai); border-color: var(--ai-border); }
.btn-ai:hover:not(:disabled) { filter: brightness(0.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-wrap { display: inline-flex; flex-direction: column; gap: 4px; align-items: flex-start; position: relative; }
.btn-reason { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; color: var(--text-3); max-width: 280px; white-space: normal; line-height: 1.35; }
.icon-btn { width: 30px; height: 30px; padding: 0; border-radius: 6px; border: 1px solid transparent; background: transparent; color: var(--text-2); display: inline-grid; place-items: center; cursor: pointer; }
.icon-btn:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
.icon-btn:disabled { opacity: .35; cursor: not-allowed; }

/* Badges */
.badge { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 500; border: 1px solid transparent; white-space: nowrap; }
.badge svg { flex: none; }
.b-fact { background: var(--fact-soft); color: var(--fact); border-color: var(--fact-border); }
.b-ai { background: var(--ai-soft); color: var(--ai); border-color: var(--ai-border); border-style: dashed; }
.b-question { background: var(--question-soft); color: var(--question); border-color: var(--question-border); }
.b-human { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.b-edited { background: var(--accent-soft); color: var(--accent-text); border-color: var(--accent); }
.b-warn { background: var(--warn-soft); color: var(--warn); }
.b-danger { background: var(--danger-soft); color: var(--danger); }
.b-discard { background: var(--discard-soft); color: var(--discard); border: 1px dashed var(--discard); }
.b-neutral { background: var(--surface-2); color: var(--text-2); border-color: var(--border); }
.b-success { background: var(--success-soft); color: var(--success); }
.badges { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); }
.card-pad { padding: 20px; }
.item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.item.is-selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.item.is-discarded { background: var(--discard-soft); border: 1px dashed var(--discard); box-shadow: none; }
.item.is-discarded .item-text { color: var(--discard); text-decoration: line-through; text-decoration-color: var(--border-strong); }
.item.is-new { border-color: var(--ai-border); }
.item-text { font-size: 15px; line-height: 1.5; color: var(--text); }
.item-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.item-note { font-size: 12px; color: var(--text-3); }
.divider { height: 1px; background: var(--border); border: 0; margin: 0; }
.human-note { border-left: 3px solid var(--accent); padding: 8px 12px; background: var(--accent-soft); border-radius: 0 8px 8px 0; font-size: 13px; }
.human-note strong { color: var(--accent-text); font-weight: 600; }
.prev-text { font-size: 13px; color: var(--text-3); background: var(--surface-2); padding: 8px 12px; border-radius: 8px; }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .label { font-weight: 600; font-size: 13px; }
.hint { font-size: 12px; color: var(--text-3); }
.error-text { font-size: 12px; color: var(--danger); display: inline-flex; gap: 4px; align-items: center; }
.input, .textarea, .select { width: 100%; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-sm); padding: 8px 12px; min-height: 38px; }
.textarea { resize: vertical; line-height: 1.55; }
.input:focus, .textarea:focus, .select:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.input.invalid, .textarea.invalid { border-color: var(--danger); }
.search { position: relative; }
.search .input { padding-left: 34px; }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; }
.check { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; font-size: 13px; color: var(--text-2); }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }
.toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

/* Tabs & segmented */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); }
.tab { background: none; border: 0; padding: 10px 12px; margin-bottom: -1px; border-bottom: 2px solid transparent; cursor: pointer; font-weight: 600; color: var(--text-3); display: inline-flex; gap: 6px; align-items: center; }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.tab .count { font-size: 12px; background: var(--surface-2); border-radius: 999px; padding: 0 7px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.segmented { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--r-sm); padding: 2px; background: var(--surface); }
.segmented button { border: 0; background: transparent; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px; color: var(--text-3); display: inline-flex; gap: 6px; align-items: center; }
.segmented button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-text); }

/* Grids */
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
.sticky-col { position: sticky; top: 96px; display: flex; flex-direction: column; gap: 16px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-16 { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.between { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

/* Progress */
.progress { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--border); }
.progress > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.pct { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 12px; }

/* Jobs list */
.job-table { display: flex; flex-direction: column; }
.job-row { display: grid; grid-template-columns: minmax(0, 2.4fr) minmax(0, 1.3fr) minmax(0, 1.2fr) minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); cursor: pointer; }
.job-row:last-child { border-bottom: 0; }
.job-row:hover { background: var(--bg); }
.job-row.head { cursor: default; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-3); font-weight: 600; padding-block: 10px; }
.job-row.head:hover { background: transparent; }
.job-name { font-weight: 600; }
.job-client { font-size: 12px; color: var(--text-3); }
.cell-label { display: none; }

/* Feedback */
.empty { text-align: center; padding: 48px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; color: var(--text-2); }
.empty-icon { width: 44px; height: 44px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; color: var(--text-3); }
.empty h3 { font-size: 16px; color: var(--text); }
.alert { display: flex; gap: 12px; padding: 12px 14px; border-radius: var(--r-sm); border: 1px solid; font-size: 13px; align-items: flex-start; }
.alert-warn { background: var(--warn-soft); border-color: var(--warn); color: var(--text); }
.alert-warn > svg { color: var(--warn); }
.alert-error { background: var(--danger-soft); border-color: var(--danger); color: var(--text); }
.alert-error > svg { color: var(--danger); }
.alert-info { background: var(--surface-2); border-color: var(--border); color: var(--text-2); }
.alert-ok { background: var(--success-soft); border-color: var(--success); color: var(--text); }
.alert-ok > svg { color: var(--success); }
.spinner { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border-strong); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.steps li { display: flex; gap: 10px; align-items: center; color: var(--text-3); }
.steps li.active { color: var(--text); font-weight: 600; }
.steps li.done { color: var(--text-2); }
.step-dot { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--border-strong); display: grid; place-items: center; flex: none; }
.steps li.done .step-dot { background: var(--success); border-color: var(--success); color: #fff; }

/* Toasts */
.toast-stack { position: fixed; right: 24px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 80; max-width: min(380px, calc(100vw - 32px)); }
.toast { background: var(--text); color: var(--bg); border-radius: 10px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; box-shadow: var(--shadow-lg); font-size: 13px; animation: rise .18s ease-out; }
.toast.warn { background: var(--warn-soft); color: var(--text); border: 1px solid var(--warn); }
.toast.warn svg { color: var(--warn); }
.toast button { margin-left: auto; background: none; border: 0; color: inherit; cursor: pointer; opacity: .7; padding: 0; }
@keyframes rise { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }

/* Overlays */
.overlay { position: fixed; inset: 0; background: var(--overlay); z-index: 60; display: grid; place-items: center; padding: 24px; }
.modal { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-lg); width: min(560px, 100%); max-height: calc(100vh - 48px); display: flex; flex-direction: column; border: 1px solid var(--border); }
.modal.wide { width: min(880px, 100%); }
.modal-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; padding: 20px 20px 12px; }
.modal-head h2 { font-size: 17px; }
.modal-body { padding: 4px 20px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
.modal-foot { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.panel-overlay { position: fixed; inset: 0; background: var(--overlay); z-index: 60; display: flex; justify-content: flex-end; }
.panel { width: min(440px, 100%); height: 100%; background: var(--surface); border-left: 1px solid var(--border); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; }
.panel .modal-body { flex: 1; }

/* Context bar */
.context-bar { position: sticky; bottom: 0; z-index: 15; background: var(--surface); border-top: 1px solid var(--border); box-shadow: 0 -6px 20px rgba(20,20,30,.06); padding: 14px 32px calc(14px + env(safe-area-inset-bottom, 0px)); }
.context-inner { max-width: 1180px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
.context-inner strong { font-weight: 700; }

/* Analysis */
.evidence-text { font-size: 13px; line-height: 1.7; color: var(--text-2); white-space: pre-wrap; }
mark.m-fact { background: var(--fact-soft); color: var(--text); border-bottom: 2px solid var(--fact); padding: 1px 2px; border-radius: 3px; }
mark.m-ai { background: var(--ai-soft); color: var(--text); border-bottom: 2px dashed var(--ai); padding: 1px 2px; border-radius: 3px; }
.counts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.count-card { border: 1px solid var(--border); border-radius: var(--r); padding: 12px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 4px; }
.count-card .n { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* Material */
.section-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); }
.section-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }

function materialCheck(materials) {
  const live = materials.filter((m) => !m.discarded);
  const has = (sec, pred) => live.some((m) => m.section === sec && pred(m));
  const warnings = [];
  if (!has("audience", (m) => m.role === "primary")) warnings.push("Defina um público primário.");
  if (!has("truth", (m) => m.selected) && !has("tension", (m) => m.role)) warnings.push("Selecione ao menos uma verdade ou tensão humana.");
  if (!has("brand", (m) => m.selected) && !has("category", (m) => m.selected)) warnings.push("Selecione ao menos um elemento de marca ou de categoria.");
  const info = [];
  if (live.filter((m) => m.section === "mechanism" && m.selected).length > 1) info.push("Mais de um mecanismo selecionado. Cada combinação usa no máximo um.");
  if (!has("mechanism", (m) => m.selected)) info.push("Mecanismo criativo é opcional.");
  return { ok: warnings.length === 0, warnings, info };
}
function isUsed(m) {
  return !!(m.selected || m.role);
}
function jobProgress(job) {
  if (!job.analyzed) return job.brief.trim() ? 5 : 0;
  if (job.presentations.length) return 92;
  if (job.finalistOrder.length >= 2) return 80;
  if (job.paths.length) return 68;
  if (job.combos.some((c) => c.state === "chosen")) return 50;
  if (materialCheck(job.materials).ok) return 35;
  if (job.analysis.some((i) => i.status === "confirmed")) return 20;
  return 10;
}
function stageStatus(job) {
  const s = {};
  if (!job.analyzed) {
    STAGES.forEach((x) => { s[x.id] = "todo"; });
    s.briefing = "current";
    return s;
  }
  s.briefing = "done";
  s.analysis = job.analysis.some((i) => i.status === "confirmed") ? "done" : "current";
  s.material = s.analysis === "done" ? (materialCheck(job.materials).ok ? "done" : "current") : "todo";
  s.combos = s.material === "done" ? (job.combos.some((c) => c.state === "chosen") ? "done" : "current") : "todo";
  s.paths = s.combos === "done" ? (job.paths.length && job.finalistOrder.length ? "done" : "current") : "todo";
  s.finalists = s.paths === "done" ? (job.presentations.length ? "done" : "current") : "todo";
  s.presentation = job.presentations.length ? "current" : "todo";
  return s;
}
function currentStageLabel(job) {
  const st = stageStatus(job);
  const cur = STAGES.find((x) => st[x.id] === "current");
  return cur ? (cur.id === "paths" ? "Caminhos criativos" : cur.label) : "Apresentação";
}

    return () => window.removeEventListener("keydown", h);
  }, [active, onClose]);
}

/* Processing overlay: runs steps, then shows done or a recoverable error. */
function ProcessingModal({ title, steps, failFirst, doneTitle, doneText, doneLabel, onDone, onClose, errorTitle, errorText, preserveNote }) {
  const [phase, setPhase] = useState("running");
  const [step, setStep] = useState(0);
  const [attempt, setAttempt] = useState(0);
  useEffect(() => {
    setPhase("running");
    setStep(0);
    const timers = steps.map((_, i) => setTimeout(() => setStep(i), i * 650));
    timers.push(setTimeout(() => setPhase(failFirst && attempt === 0 ? "error" : "done"), steps.length * 650 + 350));
    return () => timers.forEach(clearTimeout);
  }, [attempt]);
  if (phase === "error") {
    return (
      <Modal title={errorTitle || "Erro de geração"} onClose={onClose} footer={<>
        <Button variant="secondary" onClick={onClose}>Fechar</Button>
        <Button variant="primary" icon="refresh" onClick={() => setAttempt((a) => a + 1)}>Tentar novamente</Button>
      </>}>
        <Alert tone="error" title="O processamento não terminou.">{errorText}</Alert>
        <Alert tone="ok" icon="check">{preserveNote || "Nada do que você fez foi perdido. Suas escolhas e textos continuam como estavam."}</Alert>
      </Modal>
    );
  }
  if (phase === "done") {
    return (
      <Modal title={doneTitle} onClose={onClose} footer={<>
        <Button variant="secondary" onClick={onClose}>Fechar</Button>
        <Button variant="primary" iconRight="arrowRight" onClick={onDone}>{doneLabel}</Button>
      </>}>
        <Alert tone="ok" icon="check">{doneText}</Alert>
      </Modal>
    );
  }
  return (
    <Modal title={title} dismissible={false} onClose={() => {}}>
      <div className="row" style={{ gap: 12 }}>
        <span className="spinner" aria-hidden="true" />
        <span aria-live="polite">{steps[step]}…</span>
      </div>
      <ol className="steps">
        {steps.map((s, i) => (
          <li key={s} className={i < step ? "done" : i === step ? "active" : ""}>
            <span className="step-dot">{i < step ? <Icon name="check" size={12} /> : <span className="small">{i + 1}</span>}</span>
            {s}
          </li>
        ))}
      </ol>
      <p className="hint">Processamento simulado. Esta janela não fecha até terminar.</p>
    </Modal>
  );
}

                      {st[s.id] === "done" ? <Icon name="check" size={11} /> : i + 1}

            </ul>
          </div>
        </div>

      <p className="sidebar-foot">Protótipo de navegação. Dados e IA simulados.</p>

  );

/* Screen 2: New job / Briefing                                        */
/* ------------------------------------------------------------------ */
function NewJobScreen({ mode, job, form, setForm, go, toast, createDraft, saveDraft, openDemo, onReanalyzed }) {
  const isNew = mode === "new";
  const isDemo = !isNew && job.demo;
  const [errors, setErrors] = useState({});
  const [failNext, setFailNext] = useState(false);
  const [run, setRun] = useState(null);
  const [limit, setLimit] = useState(false);
  const [confirmCancel, setConfirmCancel] = useState(false);
  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));
  const dirty = isNew
    ? !!(form.name || form.client || form.brief || form.files.length)
    : form.name !== job.name || form.client !== job.client || form.brief !== job.brief || form.files.length !== job.files.length;
  const validate = (needBrief) => {
    const e = {};
    if (!form.name.trim()) e.name = "Dê um nome ao job.";
    if (!form.client.trim()) e.client = "Informe o cliente.";
    if (needBrief && form.brief.trim().length < 40) e.brief = "Cole o briefing bruto (pelo menos algumas frases).";
    setErrors(e);
    return !Object.keys(e).length;
  };
  // Saves only into this job: a new object for a new job, or the same draft's own object.
  const persist = () => {
    if (isNew) return createDraft(form);
    saveDraft(job.id, form);
    return job.id;
  };
  const save = () => {
    if (!validate(false)) return;
    const name = form.name.trim();
    persist();
    if (isNew) { toast(`Rascunho “${name}” criado. Ele aparece na lista de jobs.`); go("summary"); }
    else toast("Alterações salvas neste job.");
  };
  const analyze = () => {
    if (!validate(true)) return;
    if (isDemo) setRun(Date.now());
    else setLimit(true);
  };
  const cancel = () => {
    if (isDemo) return go("summary");
    if (dirty) return setConfirmCancel(true);
    go(isNew ? "jobs" : "summary");
  };
  const discardUnsaved = () => {
    if (isNew) { setForm({ ...EMPTY_FORM, files: [] }); go("jobs"); }
    else { setForm({ name: job.name, client: job.client, brief: job.brief, files: job.files.map((f) => ({ ...f })) }); go("summary"); }
    setConfirmCancel(false);
  };
  return (
    <div className="content-inner">
      <PageHead
        eyebrow={isNew ? "Novo job" : isDemo ? "Demonstração · briefing versão 1" : `${job.client} · rascunho`}
        title={isNew ? "Novo job" : "Briefing"}
        lede={isNew ? "Cole o briefing como veio do cliente. Um job novo começa vazio: nada de outros jobs é copiado para ele." : isDemo ? "Briefing da demonstração Brisa. Fica somente leitura para manter a análise e as evidências coerentes." : "O briefing deste rascunho. As etapas seguintes continuam vazias até existir uma análise."}
        actions={isNew && <>
          <Button variant="secondary" icon="file" onClick={() => { setForm({ ...SAMPLE_FORM, files: [] }); setErrors({}); }}>Preencher com exemplo fictício</Button>
          <Button variant="tertiary" icon="layers" onClick={() => openDemo()}>Abrir demonstração Brisa</Button>
        </>}
      />
      <div className="split">
        <div className="card card-pad stack-16">
          {isDemo && <Alert tone="info" icon="layers" title="Job de demonstração">Os dados da Brisa são simulados e só existem neste job. Nenhum job novo recebe esse conteúdo.</Alert>}
          <div className="grid-2">
            <div className="field">
              <label htmlFor="f-name">Nome do job</label>
              <input id="f-name" className={`input${errors.name ? " invalid" : ""}`} value={form.name} readOnly={isDemo} placeholder="Ex.: Projeto teste" onChange={(e) => set("name", e.target.value)} aria-invalid={!!errors.name} />
              {errors.name && <span className="error-text"><Icon name="alertCircle" size={12} />{errors.name}</span>}
            </div>
            <div className="field">
              <label htmlFor="f-client">Cliente</label>
              <input id="f-client" className={`input${errors.client ? " invalid" : ""}`} value={form.client} readOnly={isDemo} placeholder="Ex.: Aurora Café" onChange={(e) => set("client", e.target.value)} aria-invalid={!!errors.client} />
              {errors.client && <span className="error-text"><Icon name="alertCircle" size={12} />{errors.client}</span>}
            </div>
          </div>
          <div className="field">
            <label htmlFor="f-brief">Briefing bruto</label>
            <textarea id="f-brief" className={`textarea${errors.brief ? " invalid" : ""}`} rows={10} value={form.brief} readOnly={isDemo} placeholder="Cole aqui o texto do briefing, sem editar." onChange={(e) => set("brief", e.target.value)} aria-invalid={!!errors.brief} />
            <div className="between">
              {errors.brief ? <span className="error-text"><Icon name="alertCircle" size={12} />{errors.brief}</span> : <span className="hint">Não corrija o texto. A análise usa exatamente o que estiver aqui como evidência.</span>}
              <span className="hint">{form.brief.length} caracteres</span>
            </div>
          </div>
          <div className="field">
            <span className="label">Anexos</span>
            <div className="stack" style={{ gap: 8 }}>
              {form.files.length === 0 && <span className="hint">Nenhum anexo.</span>}
              {form.files.map((f, i) => (
                <div key={f.name + i} className="between chip">
                  <span className="row"><Icon name="paperclip" size={14} />{f.name} <span className="muted small">{f.size}</span></span>
                  {!isDemo && <IconButton icon="x" label={`Remover ${f.name}`} onClick={() => set("files", form.files.filter((_, j) => j !== i))} />}
                </div>
              ))}
              {!isDemo && (
                <div>
                  <Button variant="secondary" size="sm" icon="paperclip" onClick={() => set("files", [...form.files, { name: `Anexo ${form.files.length + 1} de ${form.client.trim() || "cliente"}.pdf`, size: "1,1 MB" }])}>Adicionar anexo simulado</Button>
                </div>
              )}
            </div>
          </div>
          <hr className="divider" />
          <div className="between">
            {isDemo ? (
              <label className="check">
                <input type="checkbox" checked={failNext} onChange={(e) => setFailNext(e.target.checked)} />
                Simular erro na próxima análise
              </label>
            ) : <span className="hint">{isNew ? "Nada é salvo até você salvar o rascunho ou analisar." : dirty ? "Há alterações não salvas." : "Tudo salvo neste job."}</span>}
            <div className="row">
              <Button variant="tertiary" onClick={cancel}>{isDemo ? "Voltar ao resumo" : "Cancelar"}</Button>
              {!isDemo && <Button variant="secondary" onClick={save} reason={!isNew && !dirty ? "Nenhuma alteração para salvar" : null}>{isNew ? "Salvar rascunho" : "Salvar alterações"}</Button>}
              <Button variant="primary" icon="sparkles" onClick={analyze}>{isDemo ? "Reanalisar briefing" : "Analisar briefing"}</Button>
            </div>
          </div>
        </div>
        <aside className="sticky-col">
          <div className="card card-pad stack">
            <h2>O que acontece na análise</h2>
            <ul className="log">
              <li><span className="log-icon" style={{ background: "var(--fact-soft)", color: "var(--fact)" }}><Icon name="file" size={13} /></span><span><strong>Fatos</strong> saem do texto e sempre apontam o trecho de origem.</span></li>
              <li><span className="log-icon ai"><Icon name="sparkles" size={13} /></span><span><strong>Hipóteses</strong> são inferências da IA e ficam marcadas como tal.</span></li>
              <li><span className="log-icon" style={{ background: "var(--question-soft)", color: "var(--question)" }}><Icon name="help" size={13} /></span><span><strong>Dúvidas</strong> ficam em aberto até você responder.</span></li>
              <li><span className="log-icon human"><Icon name="user" size={13} /></span><span>Nada segue adiante sem a sua confirmação.</span></li>
            </ul>
          </div>
          {isDemo
            ? <Alert tone="info" icon="layers" title="Análise simulada">A reanálise da demonstração repete o resultado simulado da Brisa. Ela não lê o texto de verdade.</Alert>
            : <Alert tone="warn" title="Limite deste protótipo">Só a demonstração Brisa tem análise simulada. Um briefing novo fica salvo como rascunho, sem análise, até existir análise real.</Alert>}
        </aside>
      </div>
      {run && (
        <ProcessingModal
          key={run}
          title="Analisando briefing"
          steps={["Lendo o briefing", "Separando fatos de hipóteses", "Listando dúvidas em aberto"]}
          failFirst={failNext}
          errorTitle="Erro de análise"
          errorText="Não conseguimos concluir a análise do briefing. Tente de novo em alguns segundos."
          preserveNote="O briefing e todas as suas decisões na demonstração continuam como estavam."
          doneTitle="Análise simulada pronta"
          doneText="Resultado simulado da demonstração Brisa: 4 fatos, 3 hipóteses e 2 dúvidas. Suas confirmações anteriores foram mantidas."
          doneLabel="Ver resultado"
          onClose={() => { setRun(null); setFailNext(false); }}
          onDone={() => { setRun(null); setFailNext(false); onReanalyzed(); }}
        />
      )}
      {limit && (
        <AnalysisUnavailableModal
          onBack={() => setLimit(false)}
          onKeepDraft={() => { const name = form.name.trim(); persist(); setLimit(false); toast(`“${name}” ficou salvo como rascunho, só com o briefing.`); go("summary"); }}
          onLoadDemo={() => { const name = form.name.trim(); persist(); setLimit(false); openDemo(name); }}
        />
      )}
      {confirmCancel && (
        <ConfirmDiscard what={isNew ? "este rascunho não salvo" : "as alterações não salvas"} detail={isNew ? "O texto digitado neste formulário será descartado. Jobs salvos, incluindo a demonstração Brisa, não são afetados." : "O briefing volta à última versão salva deste job. Nenhum outro job é afetado."} confirmLabel="Descartar" onClose={() => setConfirmCancel(false)} onConfirm={discardUnsaved} />
      )}
    </div>
  );
}

/* Screen 3: Analysis                                                  */
/* ------------------------------------------------------------------ */
function highlight(text, quote, kind) {
  if (!quote) return text;
  const i = text.indexOf(quote);
  if (i < 0) return text;
  return <>{text.slice(0, i)}<mark className={kind === "fact" ? "m-fact" : "m-ai"}>{quote}</mark>{text.slice(i + quote.length)}</>;
}
function AnalysisScreen({ job, update, go, toast, decide, openDemo }) {
  const [tab, setTab] = useState("fact");
  const [focusId, setFocusId] = useState("f1");
  const [editing, setEditing] = useState(null);
  const [discarding, setDiscarding] = useState(null);
  const [answering, setAnswering] = useState(null);
  const [showPrev, setShowPrev] = useState({});
  if (!job.analyzed) return <NotStartedStage title="Análise do briefing" job={job} go={go} openDemo={openDemo} />;
  const items = job.analysis;
  const of = (k) => items.filter((i) => i.kind === k);
  const setItem = (id, patch) => update((j) => ({ ...j, analysis: j.analysis.map((i) => (i.id === id ? { ...i, ...patch } : i)) }));
  const confirmedCount = items.filter((i) => i.status === "confirmed").length;
  const openQ = of("question").filter((i) => i.status === "open").length;
  const focus = items.find((i) => i.id === focusId);
  const tabs = [
    { id: "fact", label: "Fatos", icon: "file", count: of("fact").length },
    { id: "hyp", label: "Hipóteses", icon: "sparkles", count: of("hyp").length },
    { id: "question", label: "Dúvidas", icon: "help", count: of("question").length },
  ];
  const statusBadge = (it) => {
    if (it.status === "discarded") return <DiscardedBadge />;
    if (it.kind === "question") return it.status === "answered" ? <HumanBadge icon="message">Respondida por você</HumanBadge> : <Badge tone="question" icon="help">Em aberto</Badge>;
    if (it.status === "confirmed") return <HumanBadge>Confirmado por você</HumanBadge>;
    return <Badge tone="neutral" icon="clock">Aguardando sua decisão</Badge>;
  };
  const continueReason = confirmedCount ? null : "Confirme ao menos um fato ou hipótese para continuar";
  return (
    <div className="content-inner">
      <PageHead
        eyebrow={`${job.client} · briefing versão ${job.briefVersion}`}
        title="Análise do briefing"
        lede="A IA leu o briefing e separou o que está escrito do que ela está supondo. Confirme o que vale, corrija o que precisar e responda as dúvidas."
        actions={<Button variant="primary" iconRight="arrowRight" reason={continueReason} reasonInline onClick={() => { go("material"); }}>Continuar com itens confirmados</Button>}
      />
      <div className="counts">
        <div className="count-card"><span className="row"><OriginBadge origin="fact" /></span><span className="n">{of("fact").length}</span><span className="small muted">{of("fact").filter((i) => i.status === "confirmed").length} confirmados por você</span></div>
        <div className="count-card"><span className="row"><OriginBadge origin="hyp" /></span><span className="n">{of("hyp").length}</span><span className="small muted">{of("hyp").filter((i) => i.status === "confirmed").length} confirmadas por você</span></div>
        <div className="count-card"><span className="row"><Badge tone="question" icon="help">Dúvidas</Badge></span><span className="n">{of("question").length}</span><span className="small muted">{openQ} ainda em aberto</span></div>
      </div>
      <div className="split">
        <div className="stack-16">
          <Tabs tabs={tabs} value={tab} onChange={setTab} label="Tipos de item" />
          <div className="stack" role="tabpanel">
            {tab === "hyp" && <Alert tone="info" icon="sparkles">Hipóteses são inferências da IA. Não estão escritas no briefing e só seguem adiante se você confirmar.</Alert>}
            {tab === "question" && openQ > 0 && <Alert tone="warn" title={`${openQ} ${openQ === 1 ? "dúvida continua" : "dúvidas continuam"} em aberto`}>Você pode seguir sem responder, mas elas ficam visíveis no resumo do job até terem resposta.</Alert>}
            {of(tab).map((it) => (
              <article key={it.id} className={`item${it.status === "discarded" ? " is-discarded" : ""}${focusId === it.id && it.kind !== "question" ? " is-selected" : ""}`}>
                <div className="between">
                  <div className="badges">
                    <OriginBadge origin={it.kind === "fact" ? "fact" : it.kind === "hyp" ? "hyp" : "question"} />
                    {it.edited && <EditedBadge />}
                  </div>
                  {statusBadge(it)}
                </div>
                <p className="item-text">{it.text}</p>
                {it.kind === "question" && <p className="item-note">Por que importa: {it.why}</p>}
                {it.answer && <div className="human-note"><strong>Sua resposta:</strong> {it.answer}</div>}
                {it.edited && (
                  <div>
                    <button type="button" className="btn btn-tertiary btn-sm" onClick={() => setShowPrev((s) => ({ ...s, [it.id]: !s[it.id] }))} aria-expanded={!!showPrev[it.id]}>
                      <Icon name="clock" size={14} />{showPrev[it.id] ? "Ocultar versão anterior" : "Ver versão da IA"}
                    </button>
                    {showPrev[it.id] && <p className="prev-text">Versão da IA: {it.prevText}</p>}
                  </div>
                )}
                <div className="item-actions">
                  {it.status === "discarded" ? (
                    <Button size="sm" variant="secondary" icon="undo" onClick={() => { setItem(it.id, { status: it.kind === "question" ? (it.answer ? "answered" : "open") : "pending" }); decide(`Restaurou “${it.text}”`, "Análise"); toast("Item restaurado."); }}>Restaurar</Button>
                  ) : (
                    <>
                      {it.kind !== "question" && (it.status === "confirmed"
                        ? <Button size="sm" variant="secondary" icon="undo" onClick={() => { setItem(it.id, { status: "pending" }); decide(`Desfez a confirmação de “${it.text}”`, "Análise"); }}>Desfazer confirmação</Button>
                        : <Button size="sm" variant="primary" icon="check" onClick={() => { setItem(it.id, { status: "confirmed" }); decide(`Confirmou “${it.text}”`, "Análise"); toast("Confirmado por você."); }}>Confirmar</Button>)}
                      {it.kind === "question" && <Button size="sm" variant="primary" icon="message" onClick={() => setAnswering(it)}>{it.answer ? "Editar resposta" : "Responder"}</Button>}
                      {it.kind !== "question" && <Button size="sm" variant="secondary" icon={it.kind === "fact" ? "eye" : "file"} onClick={() => setFocusId(it.id)}>{it.kind === "fact" ? "Ver evidência" : "Ver trecho relacionado"}</Button>}
                      <Button size="sm" variant="tertiary" icon="pencil" onClick={() => setEditing(it)}>Editar</Button>
                      <Button size="sm" variant="tertiary" icon="trash" onClick={() => setDiscarding(it)}>Descartar</Button>
                    </>
                  )}
                </div>
              </article>
            ))}
          </div>
        </div>
        <aside className="sticky-col" aria-label="Briefing original">
          <div className="card card-pad stack">
            <div className="between">
              <h2>Briefing original</h2>
              <Badge tone="neutral">Versão {job.briefVersion}</Badge>
            </div>
            {focus && focus.kind === "fact" && <div className="stack" style={{ gap: 6 }}><OriginBadge origin="fact" label="Evidência do fato selecionado" /><span className="small muted">“{focus.text}”</span></div>}
            {focus && focus.kind === "hyp" && <div className="stack" style={{ gap: 6 }}><OriginBadge origin="hyp" label="Trecho que motivou a hipótese" /><span className="small muted">Não é evidência. A hipótese vai além do que está escrito.</span></div>}
            <p className="evidence-text">{focus ? highlight(job.brief, focus.quote, focus.kind) : job.brief}</p>
          </div>
        </aside>
      </div>
      {confirmedCount > 0 && (
        <ContextBar>
          <span><strong>{confirmedCount} {confirmedCount === 1 ? "item confirmado" : "itens confirmados"}</strong> por você · {items.filter((i) => i.status === "pending").length} aguardando decisão · {openQ} {openQ === 1 ? "dúvida" : "dúvidas"} em aberto</span>
          <Button variant="primary" iconRight="arrowRight" onClick={() => go("material")}>Continuar com itens confirmados</Button>
        </ContextBar>
      )}
      {editing && (
        <EditModal title="Editar item" label={editing.kind === "fact" ? "Texto do fato" : editing.kind === "hyp" ? "Texto da hipótese" : "Texto da dúvida"} value={editing.text} onClose={() => setEditing(null)}
          prevNote={editing.kind === "fact" ? "Um fato editado vira texto seu: a evidência do briefing continua ligada à versão original." : undefined}
          onSave={(v) => { setItem(editing.id, { text: v, edited: true, prevText: editing.edited ? editing.prevText : editing.text }); decide(`Editou “${editing.text}”`, "Análise"); setEditing(null); toast("Nova versão salva. Marcada como editada por você."); }} />
      )}
      {discarding && (
        <ConfirmDiscard what={`“${discarding.text}”`} onClose={() => setDiscarding(null)} onConfirm={() => { setItem(discarding.id, { status: "discarded", prevStatus: discarding.status }); decide(`Descartou “${discarding.text}”`, "Análise"); setDiscarding(null); toast("Item descartado. Ele continua visível e pode ser restaurado."); }} />
      )}
      {answering && (
        <EditModal title="Responder dúvida" label={answering.text} value={answering.answer || ""} onClose={() => setAnswering(null)}
          prevNote="Sua resposta fica registrada como nota sua. Ela não vira fato do briefing, a menos que você atualize o briefing."
          onSave={(v) => { setItem(answering.id, { answer: v, status: "answered" }); decide(`Respondeu “${answering.text}”`, "Análise"); setAnswering(null); toast("Resposta registrada."); }} />
      )}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Screen 4: Creative material                                         */
/* ------------------------------------------------------------------ */
function MaterialScreen({ job, update, go, toast, decide, logAI, openDemo }) {
  const [open, setOpen] = useState(() => Object.fromEntries(SECTIONS.map((s) => [s.id, true])));
  const [editing, setEditing] = useState(null);
  const [discarding, setDiscarding] = useState(null);
  const [swap, setSwap] = useState(null);
  const [altRun, setAltRun] = useState(null);
  if (!job.analyzed) return <NotStartedStage title="Matéria prima" job={job} go={go} openDemo={openDemo} />;
  const mats = job.materials;
  const setMat = (id, patch) => update((j) => ({ ...j, materials: j.materials.map((m) => (m.id === id ? { ...m, ...patch } : m)) }));
  const check = materialCheck(mats);
  const primaryOf = (sec) => mats.find((m) => m.section === sec && m.role === "primary" && !m.discarded);
  const secondariesOf = (sec) => mats.filter((m) => m.section === sec && m.role === "secondary" && !m.discarded);
  const roleLabel = (sec) => (sec === "audience" ? "público" : "tensão");

  const setRole = (m, role) => {
    if (role === "primary") {
      const cur = primaryOf(m.section);
      if (cur && cur.id !== m.id) { setSwap({ item: m, current: cur }); return; }
      setMat(m.id, { role: "primary", selected: true });
      decide(`Definiu ${roleLabel(m.section)} primário: “${m.text}”`, "Matéria prima");
    } else if (role === "secondary") {
      setMat(m.id, { role: "secondary", selected: true });
      decide(`Definiu ${roleLabel(m.section)} secundário: “${m.text}”`, "Matéria prima");
    } else {
      setMat(m.id, { role: null, selected: false });
      decide(`Removeu o papel de “${m.text}”`, "Matéria prima");
    }
  };
  const roleReason = (m, role) => {
    const cur = primaryOf(m.section);
    const secs = secondariesOf(m.section).filter((x) => x.id !== m.id);
    if (role === "secondary") {
      if (!cur || cur.id === m.id) return m.role === "primary" && secs.length === 0 ? "Escolha outro primário antes de tornar este secundário" : !cur ? "Defina um primário antes de adicionar secundários" : "Escolha outro primário antes de tornar este secundário";
    }
    if (role === "none" && m.role === "primary" && secs.length) return "Remova os secundários ou troque o primário antes";
    return null;
  };
  const addAlternative = (sec) => {
    const i = job.altIndex[sec] || 0;
    const pool = ALT_POOL[sec];
    const text = i < pool.length ? pool[i] : `${pool[i % pool.length]} (variação ${Math.floor(i / pool.length) + 1})`;
    const item = { id: newId("m"), section: sec, text, origin: "ai", selected: false, role: null, isNew: true };
    update((j) => ({ ...j, materials: [...j.materials, item], altIndex: { ...j.altIndex, [sec]: i + 1 } }));
    logAI(`Sugeriu uma alternativa em ${SECTION_LABEL[sec]}`, "Matéria prima");
    setOpen((o) => ({ ...o, [sec]: true }));
    toast("Nova sugestão da IA adicionada. Ela não foi selecionada.");
  };

  return (
    <div className="content-inner">
      <PageHead
        eyebrow="A partir dos itens confirmados"
        title="Matéria prima"
        lede="O material que vai ser combinado. A IA sugere, você seleciona e define o que é primário."
      />
      <div className="split">
        <div className="stack-16">
          {SECTIONS.map((s) => {
            const list = mats.filter((m) => m.section === s.id);
            const active = list.filter((m) => !m.discarded);
            const used = active.filter(isUsed).length;
            const panelId = "sec-" + s.id;
            return (
              <section key={s.id} className="section-card" aria-labelledby={panelId + "-h"}>
                <div className="section-head">
                  <button type="button" className="section-toggle" aria-expanded={open[s.id]} aria-controls={panelId} onClick={() => setOpen((o) => ({ ...o, [s.id]: !o[s.id] }))}>
                    <Icon name={open[s.id] ? "chevronDown" : "chevronRight"} />
                    <span className="stack" style={{ gap: 0 }}>
                      <h2 id={panelId + "-h"}>{s.label}</h2>
                      <span className="small muted">{used} {used === 1 ? "selecionado" : "selecionados"} de {active.length}</span>
                    </span>
                  </button>
                  <Button size="sm" variant="ai" icon="sparkles" onClick={() => setAltRun({ key: Date.now(), sec: s.id })}>Pedir alternativas</Button>
                </div>
                {open[s.id] && (
                  <div className="section-body stack" id={panelId}>
                    <p className="hint">{s.hint}</p>
                    <div className="grid-2">
                      {list.map((m) => (
                        <article key={m.id} className={`item${m.discarded ? " is-discarded" : isUsed(m) ? " is-selected" : m.isNew ? " is-new" : ""}`}>
                          <div className="badges">
                            <OriginBadge origin={m.origin} />
                            {m.isNew && !m.discarded && <Badge tone="ai" icon="sparkles">Nova</Badge>}
                            {m.edited && <EditedBadge />}
                            {m.discarded && <DiscardedBadge />}
                            {!m.discarded && m.role === "primary" && <HumanBadge icon="target">Primário · por você</HumanBadge>}
                            {!m.discarded && m.role === "secondary" && <HumanBadge icon="target">Secundário · por você</HumanBadge>}
                            {!m.discarded && !s.roles && m.selected && <HumanBadge>Selecionado por você</HumanBadge>}
                          </div>
                          <p className="item-text">{m.text}</p>
                          {m.edited && <p className="item-note">Versão da IA: {m.prevText}</p>}
                          <div className="item-actions">
                            {m.discarded ? (
                              <Button size="sm" variant="secondary" icon="undo" onClick={() => { setMat(m.id, { discarded: false }); decide(`Restaurou “${m.text}”`, "Matéria prima"); }}>Restaurar</Button>
                            ) : s.roles ? (
                              <>
                                {m.role !== "primary" && <Button size="sm" variant="primary" icon="target" onClick={() => setRole(m, "primary")}>Tornar primário</Button>}
                                {m.role !== "secondary" && <Button size="sm" variant="secondary" reason={roleReason(m, "secondary")} onClick={() => setRole(m, "secondary")}>Tornar secundário</Button>}
                                {m.role && <Button size="sm" variant="tertiary" icon="x" reason={roleReason(m, "none")} onClick={() => setRole(m, null)}>Remover papel</Button>}
                              </>
                            ) : m.selected ? (
                              <Button size="sm" variant="secondary" icon="x" onClick={() => { setMat(m.id, { selected: false }); decide(`Removeu a seleção de “${m.text}”`, "Matéria prima"); }}>Remover seleção</Button>
                            ) : (
                              <Button size="sm" variant="primary" icon="check" onClick={() => { setMat(m.id, { selected: true, isNew: false }); decide(`Selecionou “${m.text}”`, "Matéria prima"); }}>Selecionar</Button>
                            )}
                            {!m.discarded && <Button size="sm" variant="tertiary" icon="pencil" onClick={() => setEditing(m)}>Editar</Button>}
                            {!m.discarded && <Button size="sm" variant="tertiary" icon="trash" reason={isUsed(m) ? "Remova a seleção antes de descartar" : null} onClick={() => setDiscarding(m)}>Descartar</Button>}
                          </div>
                        </article>
                      ))}
                    </div>
                  </div>
                )}
              </section>
            );
          })}
        </div>
        <aside className="sticky-col" aria-label="Resumo da seleção">
          <div className="card card-pad stack-16">
            <h2>Sua seleção</h2>
            <ul className="sum-list">
              {SECTIONS.map((s) => {
                const sel = mats.filter((m) => m.section === s.id && !m.discarded && isUsed(m));
                return (
                  <li key={s.id}>
                    <span className="sum-sec">{s.label}</span>
                    {sel.length ? sel.map((m) => <span key={m.id} className="small">{m.role ? (m.role === "primary" ? "Primário: " : "Secundário: ") : ""}{m.text}</span>) : <span className="small muted">Nada selecionado</span>}
                  </li>
                );
              })}
            </ul>
            {check.warnings.map((w) => <Alert key={w} tone="warn">{w}</Alert>)}
            {check.info.map((w) => <p key={w} className="hint row"><Icon name="info" size={13} />{w}</p>)}
            <Button variant="primary" iconRight="arrowRight" reason={check.ok ? null : "Resolva os avisos acima para criar combinações"} reasonInline onClick={() => { go("combos"); }}>Criar combinações</Button>
          </div>
        </aside>
      </div>
      {editing && (
        <EditModal title="Editar item" label={SECTION_LABEL[editing.section]} value={editing.text} onClose={() => setEditing(null)}
          prevNote="Combinações que já usam este item continuam apontando para a versão anterior."
          onSave={(v) => { setMat(editing.id, { text: v, edited: true, prevText: editing.edited ? editing.prevText : editing.text }); decide(`Editou “${editing.text}”`, "Matéria prima"); setEditing(null); toast("Nova versão salva. Marcada como editada por você."); }} />
      )}
      {discarding && (
        <ConfirmDiscard what={`“${discarding.text}”`} onClose={() => setDiscarding(null)} onConfirm={() => { setMat(discarding.id, { discarded: true }); decide(`Descartou “${discarding.text}”`, "Matéria prima"); setDiscarding(null); toast("Item descartado. Ele continua visível e pode ser restaurado."); }} />
      )}
      {swap && (
        <Modal title={`Trocar ${roleLabel(swap.item.section)} primário`} onClose={() => setSwap(null)} footer={<>
          <Button variant="secondary" onClick={() => setSwap(null)}>Cancelar</Button>
          <Button variant="secondary" onClick={() => {
            const secs = secondariesOf(swap.item.section).filter((x) => x.id !== swap.item.id && x.id !== swap.current.id);
            update((j) => ({ ...j, materials: j.materials.map((m) => m.id === swap.current.id ? { ...m, role: null, selected: false } : m.id === swap.item.id ? { ...m, role: "primary", selected: true } : m) }));
            decide(`Removeu o papel de “${swap.current.text}” e definiu “${swap.item.text}” como primário`, "Matéria prima");
            setSwap(null);
            if (secs.length) toast("Primário trocado. Os secundários continuam como estavam.");
          }}>Remover papel do atual</Button>
          <Button variant="primary" onClick={() => {
            update((j) => ({ ...j, materials: j.materials.map((m) => m.id === swap.current.id ? { ...m, role: "secondary" } : m.id === swap.item.id ? { ...m, role: "primary", selected: true } : m) }));
            decide(`Tornou “${swap.current.text}” secundário e definiu “${swap.item.text}” como primário`, "Matéria prima");
            setSwap(null);
          }}>Tornar o atual secundário</Button>
        </>}>
          <p>Já existe um primário: <strong>“{swap.current.text}”</strong>.</p>
          <p className="lede">Nada muda sozinho. Escolha o que acontece com o primário atual.</p>
        </Modal>
      )}
      {altRun && (
        <ProcessingModal key={altRun.key} title="Gerar alternativas" steps={["Lendo sua seleção atual", `Gerando alternativa para ${SECTION_LABEL[altRun.sec]}`]}
          doneTitle="Alternativa pronta" doneText="1 nova sugestão da IA. Ela entra na lista sem seleção. A decisão continua sua." doneLabel="Adicionar à lista"
          onClose={() => setAltRun(null)} onDone={() => { addAlternative(altRun.sec); setAltRun(null); }} />
      )}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Screen 5: Combinations                                              */
/* ------------------------------------------------------------------ */
const COMBO_ALTS = [
  { title: "A pausa que não isola", synthesis: "Brisa marca presença nos intervalos da noite, quando a conversa acontece.", ids: ["m3", "m6", "m9"] },
  { title: "Brinde sem pergunta", synthesis: "O gesto do brinde é o mesmo. A pergunta “o que você está bebendo?” some.", ids: ["m5", "m7"] },
];
function comboRule(ids, materials) {
  const secs = ids.map((id) => (materials.find((m) => m.id === id) || {}).section);
  const human = secs.filter((s) => s === "truth" || s === "tension").length;
  const brand = secs.filter((s) => s === "brand" || s === "category").length;
  const mech = secs.filter((s) => s === "mechanism").length;
  const errs = [];
  if (!human) errs.push("Inclua ao menos uma verdade ou tensão humana.");
  if (!brand) errs.push("Inclua ao menos um elemento de marca ou de categoria.");
  if (mech > 1) errs.push("Use no máximo um mecanismo criativo.");
  if (ids.length > 5) errs.push("Use no máximo cinco componentes.");
  return errs;
}
function ComboComponents({ combo, materials }) {
  return (
    <div className="chips">
      {combo.components.map((c) => {
        const cur = materials.find((m) => m.id === c.id);
        const changed = cur && cur.text !== c.text;
        return (
          <div key={c.id} className="chip">
            <span className="k">{SECTION_LABEL[c.section]}</span>
            <span>{c.text}{changed && <span className="muted small"> · há versão mais nova</span>}</span>
          </div>
        );
      })}
    </div>
  );
}
function CombosScreen({ job, update, go, toast, decide, logAI, openDemo }) {
  const [inspect, setInspect] = useState(null);
  const [editing, setEditing] = useState(null);
  const [discarding, setDiscarding] = useState(null);
  const [altRun, setAltRun] = useState(null);
  const [genRun, setGenRun] = useState(null);
  const chosen = job.combos.filter((c) => c.state === "chosen");
  const [genFrom, setGenFrom] = useState(null);
  const genSource = chosen.find((c) => c.id === genFrom) || chosen[0];
  if (!job.analyzed) return <NotStartedStage title="Combinações" job={job} go={go} openDemo={openDemo} />;
  const setCombo = (id, patch) => update((j) => ({ ...j, combos: j.combos.map((c) => (c.id === id ? { ...c, ...patch } : c)) }));
  const genReason = chosen.length ? null : "Escolha uma combinação para gerar caminhos";

  const addAlt = () => {
    const used = job.combos.filter((c) => c.origin === "ai").length - 3;
    const alt = COMBO_ALTS[used % COMBO_ALTS.length];
    const round = job.comboRound + 1;
    const combo = { id: newId("c"), title: used >= COMBO_ALTS.length ? `${alt.title} (rodada ${round})` : alt.title, synthesis: alt.synthesis, components: snap(job.materials, alt.ids), origin: "ai", round, state: "proposed", isNew: true };
    update((j) => ({ ...j, combos: [...j.combos, combo], comboRound: round }));
    logAI(`Propôs a combinação “${combo.title}”`, "Combinações");
    toast("Nova combinação sugerida pela IA. Ela não foi escolhida.");
  };
  const generatePaths = () => {
    const src = genSource.title;
    update((j) => {
      const live = j.paths.filter((p) => !p.discarded);
      let add;
      if (!live.length && !j.paths.length) add = basePaths(src);
      else {
        const k = j.pathRounds - 1;
        const extra = EXTRA_PATHS[k % EXTRA_PATHS.length];
        add = [{ ...extra, id: newId("p"), title: k >= EXTRA_PATHS.length ? `${extra.title} ${k + 1}` : extra.title, source: src, origin: "ai", finalist: false, discarded: false, round: j.pathRounds + 1 }];
      }
      return { ...j, paths: [...j.paths, ...add], pathRounds: j.pathRounds + 1 };
    });
    logAI(`Gerou caminhos a partir de “${src}”`, "Caminhos");
    setGenRun(null);
    go("paths");
  };
  return (
    <div className="content-inner">
      <PageHead
        eyebrow="A partir da sua matéria prima"
        title="Combinações"
        lede="A IA cruzou o material selecionado. Cada combinação mostra exatamente o que usa. Só você escolhe qual segue para caminhos."
        actions={<>
          <Button variant="ai" icon="sparkles" onClick={() => setAltRun(Date.now())}>Gerar alternativas</Button>
          <Button variant="primary" icon="flag" reason={genReason} reasonInline onClick={() => setGenRun(Date.now())}>Gerar caminhos</Button>
        </>}
      />
      <Alert tone="info" icon="user">A IA propõe combinações, mas nunca escolhe uma. “Escolhida por você” só aparece depois do seu clique.</Alert>
      <div className="grid-3">
        {job.combos.map((c) => {
          const isChosen = c.state === "chosen";
          const isDiscarded = c.state === "discarded";
          return (
            <article key={c.id} className={`item combo-card${isChosen ? " is-chosen" : ""}${isDiscarded ? " is-discarded" : ""}${c.isNew && !isChosen && !isDiscarded ? " is-new" : ""}`}>
              <div className="between">
                <div className="badges">
                  {c.origin === "user" ? <OriginBadge origin="user" label="Composição sua" /> : <OriginBadge origin="ai" label={`Sugestão da IA · rodada ${c.round}`} />}
                </div>
                {isChosen ? <HumanBadge icon="check">Escolhida por você</HumanBadge> : isDiscarded ? <DiscardedBadge /> : <Badge tone="neutral" icon="clock">Aguardando sua escolha</Badge>}
              </div>
              <h3 className={isDiscarded ? "item-text" : ""}>{c.title}</h3>
              <p className="lede">{c.synthesis}</p>
              <div className="stack" style={{ gap: 6 }}>
                <span className="eyebrow">Componentes usados · {c.components.length}</span>
                <ComboComponents combo={c} materials={job.materials} />
              </div>
              {c.derivedFrom && <p className="item-note row"><Icon name="branch" size={12} />Derivada de “{c.derivedFrom}”, que continua disponível.</p>}
              <hr className="divider" />
              <div className="item-actions">
                {isDiscarded ? (
                  <Button size="sm" variant="secondary" icon="undo" onClick={() => { setCombo(c.id, { state: "proposed" }); decide(`Restaurou a combinação “${c.title}”`, "Combinações"); }}>Restaurar</Button>
                ) : isChosen ? (
                  <Button size="sm" variant="secondary" icon="x" onClick={() => { setCombo(c.id, { state: "proposed" }); decide(`Removeu a escolha de “${c.title}”`, "Combinações"); }}>Remover escolha</Button>
                ) : (
                  <Button size="sm" variant="primary" icon="check" onClick={() => { setCombo(c.id, { state: "chosen", isNew: false }); decide(`Escolheu a combinação “${c.title}”`, "Combinações"); toast(`“${c.title}” escolhida por você.`); }}>Escolher</Button>
                )}
                <Button size="sm" variant="tertiary" icon="branch" onClick={() => setInspect(c)}>Inspecionar origem</Button>
                {!isDiscarded && <Button size="sm" variant="tertiary" icon="pencil" onClick={() => setEditing(c)}>Editar composição</Button>}
                {!isDiscarded && <Button size="sm" variant="tertiary" icon="trash" reason={isChosen ? "Remova a escolha antes de descartar" : null} onClick={() => setDiscarding(c)}>Descartar</Button>}
              </div>
            </article>
          );
        })}
      </div>
      {chosen.length > 0 && (
        <ContextBar>
          <span className="row">
            <HumanBadge>{chosen.length === 1 ? "1 combinação escolhida" : `${chosen.length} combinações escolhidas`}</HumanBadge>
            {chosen.length > 1 ? (
              <>
                <label htmlFor="gen-from" className="small">Gerar a partir de</label>
                <select id="gen-from" className="select" style={{ width: 240 }} value={genSource.id} onChange={(e) => setGenFrom(e.target.value)}>
                  {chosen.map((c) => <option key={c.id} value={c.id}>{c.title}</option>)}
                </select>
              </>
            ) : <strong>{genSource.title}</strong>}
          </span>
          <Button variant="primary" icon="flag" onClick={() => setGenRun(Date.now())}>Gerar caminhos</Button>
        </ContextBar>
      )}
      {inspect && (
        <SidePanel title={inspect.title} eyebrow="Inspecionar origem" onClose={() => setInspect(null)}>
          <div className="badges">
            {inspect.origin === "user" ? <OriginBadge origin="user" label="Composição sua" /> : <OriginBadge origin="ai" label={`Sugestão da IA · rodada ${inspect.round}`} />}
            {inspect.state === "chosen" && <HumanBadge>Escolhida por você</HumanBadge>}
          </div>
          <p className="lede">{inspect.synthesis}</p>
          <div className="stack">
            <span className="eyebrow">Versões exatas usadas</span>
            {inspect.components.map((c) => {
              const cur = job.materials.find((m) => m.id === c.id);
              return (
                <div key={c.id} className="item" style={{ padding: 12, gap: 8 }}>
                  <div className="between"><span className="sum-sec">{SECTION_LABEL[c.section]}</span><OriginBadge origin={c.origin} /></div>
                  <p>{c.text}</p>
                  <div className="badges">
                    {c.edited && <EditedBadge />}
                    {cur && cur.text !== c.text && <Badge tone="warn" icon="alert">O item foi editado depois. Esta combinação mantém a versão acima.</Badge>}
                    {cur && cur.discarded && <Badge tone="discard">Item descartado depois</Badge>}
                  </div>
                </div>
              );
            })}
          </div>
          <div className="stack" style={{ gap: 6 }}>
            <span className="eyebrow">Rastreabilidade</span>
            <p className="small muted">{inspect.origin === "user" ? `Criada por você a partir de “${inspect.derivedFrom}”.` : `Gerada pela IA a partir da matéria prima selecionada, na rodada ${inspect.round}. Briefing versão ${job.briefVersion}.`}</p>
            <p className="small muted">A IA não escolhe combinações. A escolha é registrada como decisão sua.</p>
          </div>
        </SidePanel>
      )}
      {editing && <ComposeModal combo={editing} materials={job.materials} onClose={() => setEditing(null)} onSave={(ids, title) => {
        const combo = { id: newId("c"), title, synthesis: editing.synthesis, components: snap(job.materials, ids), origin: "user", round: editing.round, state: "proposed", derivedFrom: editing.title };
        update((j) => ({ ...j, combos: [...j.combos, combo] }));
        decide(`Criou a combinação “${title}” a partir de “${editing.title}”`, "Combinações");
        setEditing(null);
        toast("Nova combinação criada. A original continua disponível.");
      }} />}
      {discarding && (
        <ConfirmDiscard what={`a combinação “${discarding.title}”`} onClose={() => setDiscarding(null)} onConfirm={() => { setCombo(discarding.id, { state: "discarded" }); decide(`Descartou a combinação “${discarding.title}”`, "Combinações"); setDiscarding(null); toast("Combinação descartada. Ela pode ser restaurada."); }} />
      )}
      {altRun && (
        <ProcessingModal key={altRun} title="Gerar alternativas" steps={["Relendo a matéria prima selecionada", "Cruzando verdades, tensões e marca"]}
          doneTitle="Alternativa pronta" doneText="1 nova combinação sugerida pela IA. Ela não foi escolhida." doneLabel="Adicionar à lista"
          onClose={() => setAltRun(null)} onDone={() => { addAlt(); setAltRun(null); }} />
      )}
      {genRun && genSource && (
        <ProcessingModal key={genRun} title="Gerando caminhos" steps={[`Lendo “${genSource.title}”`, "Cruzando com público e tensão", "Escrevendo caminhos criativos"]}
          doneTitle="Caminhos prontos" doneText={`Caminhos gerados a partir de “${genSource.title}”. Nenhum foi marcado como finalista.`} doneLabel="Ver caminhos"
          onClose={() => setGenRun(null)} onDone={generatePaths} />
      )}
    </div>
  );
}
function ComposeModal({ combo, materials, onClose, onSave }) {
  const [ids, setIds] = useState(combo.components.map((c) => c.id));
  const [title, setTitle] = useState(combo.title + " (versão sua)");
  const eligible = materials.filter((m) => !m.discarded && m.section !== "audience");
  const errs = comboRule(ids, materials);
  const same = ids.length === combo.components.length && ids.every((id) => combo.components.some((c) => c.id === id));
  const toggle = (id) => setIds((s) => (s.includes(id) ? s.filter((x) => x !== id) : [...s, id]));
  return (
    <Modal wide title="Editar composição" onClose={onClose} footer={<>
      <Button variant="secondary" onClick={onClose}>Cancelar</Button>
      <Button variant="primary" icon="check" reason={errs.length ? "Corrija a composição para salvar" : same ? "Mude ao menos um componente" : !title.trim() ? "Dê um nome à combinação" : null} onClick={() => onSave(ids, title.trim())}>Salvar como nova combinação</Button>
    </>}>
      <Alert tone="info" icon="branch">Mudar os componentes cria uma nova combinação. “{combo.title}” continua disponível como está.</Alert>
      <div className="field">
        <label htmlFor="combo-title">Nome da nova combinação</label>
        <input id="combo-title" className="input" value={title} onChange={(e) => setTitle(e.target.value)} />
      </div>
      <fieldset className="stack" style={{ border: 0, padding: 0, margin: 0 }}>
        <legend className="label">Componentes ({ids.length} de no máximo 5)</legend>
        {SECTIONS.filter((s) => s.id !== "audience").map((s) => {
          const list = eligible.filter((m) => m.section === s.id);
          if (!list.length) return null;
          return (
            <div key={s.id} className="stack" style={{ gap: 6 }}>
              <span className="sum-sec">{s.label}</span>
              {list.map((m) => (
                <label key={m.id} className="check"><input type="checkbox" checked={ids.includes(m.id)} onChange={() => toggle(m.id)} />{m.text}</label>
              ))}
            </div>
          );
        })}
      </fieldset>
      {errs.map((e) => <Alert key={e} tone="warn">{e}</Alert>)}
    </Modal>
  );
}
