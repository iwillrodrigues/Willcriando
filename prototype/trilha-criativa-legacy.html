function PathEditModal({ path, onSave, onClose }) {
  const [f, setF] = useState({ premise: path.premise, execution: path.execution, tone: path.tone, risks: path.risks });
  const changed = Object.keys(f).some((k) => f[k].trim() !== path[k].trim());
  const fields = [["premise", "Premissa", 2], ["execution", "Ideia de execução", 4], ["tone", "Tom", 1], ["risks", "Riscos", 2]];
  return (
    <Modal wide title={`Editar “${path.title}”`} onClose={onClose} footer={<>
      <Button variant="secondary" onClick={onClose}>Cancelar</Button>
      <Button variant="primary" icon="check" reason={changed ? null : "Altere algum campo para salvar uma nova versão"} onClick={() => onSave(f)}>Salvar como versão sua</Button>
    </>}>
      {fields.map(([k, label, rows]) => (
        <div key={k} className="field">
          <label htmlFor={"pe-" + k}>{label}</label>
          <textarea id={"pe-" + k} className="textarea" rows={rows} value={f[k]} onChange={(e) => setF({ ...f, [k]: e.target.value })} />
        </div>
      ))}
      <p className="hint">O caminho continua ligado à mesma combinação de origem. A versão da IA fica guardada.</p>
    </Modal>
  );
}
function PathsScreen({ job, update, go, toast, decide, logAI, openDemo }) {
  const [view, setView] = useState("grid");
  const [editing, setEditing] = useState(null);
  const [discarding, setDiscarding] = useState(null);
  const [varRun, setVarRun] = useState(null);
  const [simulateError, setSimulateError] = useState(false);
  const [showDiscarded, setShowDiscarded] = useState(false);
  const live = job.paths.filter((p) => !p.discarded);
  const discarded = job.paths.filter((p) => p.discarded);
  const finalists = job.finalistOrder.map((id) => job.paths.find((p) => p.id === id)).filter(Boolean);
  const sources = [...new Set(job.paths.map((p) => p.source))];
  const setPath = (id, patch) => update((j) => ({ ...j, paths: j.paths.map((p) => (p.id === id ? { ...p, ...patch } : p)) }));
  const toggleFinalist = (p) => {
    const on = !job.finalistOrder.includes(p.id);
    update((j) => ({ ...j, finalistOrder: on ? [...j.finalistOrder, p.id] : j.finalistOrder.filter((x) => x !== p.id), evals: on && !j.evals[p.id] ? { ...j.evals, [p.id]: DEFAULT_EVAL[p.id] || { strategy: 3, distinction: 3, fit: 3, flexibility: 3, risks: p.risks, comment: "" } } : j.evals }));
    decide(on ? `Selecionou “${p.title}” como finalista` : `Removeu “${p.title}” dos finalistas`, "Caminhos");
    if (!on) toast("Removido dos finalistas. O caminho continua disponível.");
  };
  const addVariation = (p) => {
    const v = { ...p, id: newId("p"), title: `${p.title} · variação`, premise: `Variação de “${p.title}”: a mesma ideia contada a partir de quem serve as bebidas na noite.`, origin: "ai", variationOf: p.title, finalist: false, discarded: false, edited: false, prev: null };
    update((j) => ({ ...j, paths: [...j.paths, v] }));
    logAI(`Gerou uma variação de “${p.title}”`, "Caminhos");
    toast("Variação adicionada como sugestão da IA.");
  };
  const isFin = (p) => job.finalistOrder.includes(p.id);
  const originBadge = (p) => p.edited ? <EditedBadge /> : p.variationOf ? <OriginBadge origin="ai" label="Variação da IA" /> : <OriginBadge origin="ai" />;

  if (!job.analyzed) return <NotStartedStage title="Caminhos criativos" job={job} go={go} openDemo={openDemo} />;
  if (!job.paths.length) {
    return (
      <div className="content-inner">
        <PageHead title="Caminhos criativos" />
        <div className="card"><EmptyState icon="flag" title="Nenhum caminho gerado ainda" action={<Button variant="primary" iconRight="arrowRight" onClick={() => go("combos")}>Ir para Combinações</Button>}>Escolha uma combinação e peça para gerar caminhos. Eles aparecem aqui, sem nenhum finalista marcado.</EmptyState></div>
      </div>
    );
  }
  return (
    <div className="content-inner">
      <PageHead
        eyebrow="Etapa atual"
        title="Caminhos criativos"
        lede="Direções criativas geradas a partir da combinação que você escolheu. Compare, ajuste e marque os finalistas."
        actions={<Segmented label="Visualização" value={view} onChange={setView} options={[{ id: "grid", label: "Grade", icon: "grid" }, { id: "compare", label: "Comparar", icon: "columns" }]} />}
      >
        <div className="row">
          <span className="small muted">Origem:</span>
          {sources.map((s) => <Badge key={s} tone="edited" icon="branch">{s}</Badge>)}
          <HumanBadge>Escolhida por você</HumanBadge>
        </div>
      </PageHead>
      <div className="between">
        <span className="small muted">{live.length} caminhos ativos · {finalists.length} {finalists.length === 1 ? "finalista" : "finalistas"}{discarded.length ? ` · ${discarded.length} descartados` : ""}</span>
        <label className="check"><input type="checkbox" checked={simulateError} onChange={(e) => setSimulateError(e.target.checked)} />Simular erro na próxima geração de variação</label>
      </div>
      {view === "grid" ? (
        <div className="grid-3">
          {live.map((p) => (
            <article key={p.id} className={`item${isFin(p) ? " is-selected" : ""}`}>
              <div className="between">
                <div className="badges">{originBadge(p)}</div>
                {isFin(p) ? <HumanBadge icon="star">Finalista · por você</HumanBadge> : null}
              </div>
              <h3>{p.title}</h3>
              <p className="lede">{p.premise}</p>
              <dl className="dl">
                <dt>Execução</dt><dd>{p.execution}</dd>
                <dt>Tom</dt><dd>{p.tone}</dd>
                <dt>Peças</dt><dd>{p.pieces.join(" · ")}</dd>
                <dt>Riscos</dt><dd className="row" style={{ alignItems: "flex-start", flexWrap: "nowrap" }}><Icon name="alert" size={14} className="" />{p.risks}</dd>
                <dt>Origem</dt><dd><span className="row"><Icon name="branch" size={13} />{p.source}{p.variationOf ? ` · variação de “${p.variationOf}”` : ""}</span></dd>
              </dl>
              {p.edited && p.prev && <p className="item-note">Versão da IA guardada: “{p.prev.premise}”</p>}
              <hr className="divider" />
              <div className="item-actions">
                <Button size="sm" variant={isFin(p) ? "secondary" : "primary"} icon={isFin(p) ? "x" : "star"} onClick={() => toggleFinalist(p)}>{isFin(p) ? "Remover dos finalistas" : "Marcar como finalista"}</Button>
                <Button size="sm" variant="tertiary" icon="pencil" onClick={() => setEditing(p)}>Editar</Button>
                <Button size="sm" variant="tertiary" icon="sparkles" onClick={() => setVarRun({ key: Date.now(), path: p, fail: simulateError })}>Gerar variação</Button>
                <Button size="sm" variant="tertiary" icon="trash" reason={isFin(p) ? "Remova dos finalistas antes de descartar" : null} onClick={() => setDiscarding(p)}>Descartar</Button>
              </div>
            </article>
          ))}
        </div>
      ) : (
        <div className="table-wrap">
          <table className="cmp">
            <thead>
              <tr>
                <th scope="col"><span className="sr-only">Critério</span></th>
                {live.map((p) => (
                  <th key={p.id} scope="col">
                    <div className="stack" style={{ gap: 6 }}>
                      <strong>{p.title}</strong>
                      <div className="badges">{originBadge(p)}{isFin(p) && <HumanBadge icon="star">Finalista</HumanBadge>}</div>
                      <div><Button size="sm" variant={isFin(p) ? "secondary" : "primary"} icon={isFin(p) ? "x" : "star"} onClick={() => toggleFinalist(p)}>{isFin(p) ? "Remover" : "Finalista"}</Button></div>
                    </div>
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {[["Premissa", "premise"], ["Execução", "execution"], ["Tom", "tone"], ["Peças", "pieces"], ["Riscos", "risks"], ["Origem", "source"]].map(([label, k]) => (
                <tr key={k}>
                  <th scope="row">{label}</th>
                  {live.map((p) => <td key={p.id}>{Array.isArray(p[k]) ? p[k].join(" · ") : p[k]}</td>)}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
      {discarded.length > 0 && (
        <div className="stack">
          <button type="button" className="btn btn-tertiary" style={{ alignSelf: "flex-start" }} aria-expanded={showDiscarded} onClick={() => setShowDiscarded(!showDiscarded)}>
            <Icon name={showDiscarded ? "chevronDown" : "chevronRight"} />Descartados ({discarded.length})
          </button>
          {showDiscarded && (
            <div className="grid-3">
              {discarded.map((p) => (
                <article key={p.id} className="item is-discarded">
                  <div className="badges"><DiscardedBadge /></div>
                  <h3 className="item-text">{p.title}</h3>
                  <p className="small muted">{p.premise}</p>
                  <div><Button size="sm" variant="secondary" icon="undo" onClick={() => { setPath(p.id, { discarded: false }); decide(`Restaurou o caminho “${p.title}”`, "Caminhos"); }}>Restaurar</Button></div>
                </article>
              ))}
            </div>
          )}
        </div>
      )}
      {finalists.length > 0 && (
        <ContextBar>
          <span className="row"><HumanBadge icon="star">{finalists.length === 1 ? "1 caminho selecionado" : `${finalists.length} caminhos selecionados`}</HumanBadge><span className="small">{finalists.map((p) => p.title).join(" · ")}</span></span>
          <Button variant="primary" iconRight="arrowRight" onClick={() => go("finalists")}>Revisar finalistas</Button>
        </ContextBar>
      )}
      {editing && <PathEditModal path={editing} onClose={() => setEditing(null)} onSave={(f) => {
        setPath(editing.id, { ...f, edited: true, prev: editing.prev || { premise: editing.premise } });
        decide(`Editou o caminho “${editing.title}”`, "Caminhos");
        setEditing(null);
        toast("Nova versão do caminho salva. Marcada como editada por você.");
      }} />}
      {discarding && (
        <ConfirmDiscard what={`o caminho “${discarding.title}”`} onClose={() => setDiscarding(null)} onConfirm={() => { setPath(discarding.id, { discarded: true }); decide(`Descartou o caminho “${discarding.title}”`, "Caminhos"); setDiscarding(null); setShowDiscarded(true); toast("Caminho descartado. Ele está em “Descartados” e pode ser restaurado."); }} />
      )}
      {varRun && (
        <ProcessingModal key={varRun.key} title="Gerando variação" steps={[`Lendo “${varRun.path.title}”`, "Mantendo a mesma origem", "Escrevendo a variação"]} failFirst={varRun.fail}
          errorTitle="Erro de geração" errorText={`A variação de “${varRun.path.title}” não foi gerada. O serviço de IA simulado não respondeu a tempo.`}
          preserveNote="Nenhum caminho foi alterado. Seus finalistas e edições continuam como estavam."
          doneTitle="Variação pronta" doneText="1 variação gerada. Ela entra como sugestão da IA, fora dos finalistas." doneLabel="Adicionar variação"
          onClose={() => { if (varRun.fail) setSimulateError(false); setVarRun(null); }}
          onDone={() => { addVariation(varRun.path); if (varRun.fail) setSimulateError(false); setVarRun(null); }} />
      )}
    </div>
  );
}

function ScoreControl({ value, onChange, label }) {
  return (
    <div className="score" role="group" aria-label={label}>
      {[1, 2, 3, 4, 5].map((n) => <button key={n} type="button" aria-pressed={value === n} aria-label={`${label}: ${n} de 5`} onClick={() => onChange(n)}>{n}</button>)}

}
function buildBlocks(job, finalists) {
  const rec = job.recommendation.text;
  const blocks = [
    { baseId: "b1", title: "O desafio", body: "Brisa chega no verão como um chá gaseificado sem álcool, em lata. O desafio é torná-la uma escolha desejável nos encontros em que a pessoa quer participar do ritual, mas não quer beber álcool." },
    { baseId: "b2", title: "O que descobrimos", body: "O briefing pede foco nas capitais, nas noites entre amigos e nos canais digitais, sem tom moralista. Nossa leitura: quem não bebe não quer ser tratado como exceção, nem ter que se explicar na mesa." },
    { baseId: "b3", title: "A tensão humana", body: "“Quero fazer uma escolha melhor sem precisar explicá-la.” Pertencer parece mais fácil quando todos repetem o mesmo ritual. É aí que a escolha sem álcool costuma virar assunto." },
    { baseId: "b4", title: "A oportunidade criativa", body: "Reenquadrar a escolha sem álcool como presença, não ausência. Brisa entra no brinde, no copo e na foto do grupo, com bolhas, sabor adulto e uma lata elegante, sem virar pauta." },
  ];
  finalists.forEach((p, i) => blocks.push({ baseId: "path-" + p.id, title: `Caminho ${i + 1}: ${p.title}`, body: `${p.premise} ${p.execution} Tom: ${p.tone.toLowerCase()} Peças: ${p.pieces.join(", ")}.` }));
  blocks.push({ baseId: "b7", title: "Comparação e recomendação", body: `${finalists.map((p) => p.title).join(" e ")} respondem à mesma tensão por lados diferentes. ${rec}` });
  return blocks.map((b) => ({ ...b, id: newId("b"), author: "ai", hidden: false, versions: [{ n: 1, label: "Rascunho gerado com IA a partir das suas decisões", body: b.body, author: "ai" }] }));
}
function FinalistsScreen({ job, update, go, toast, decide, logAI, openDemo }) {

  const setEval = (pid, patch) => update((j) => ({ ...j, evals: { ...j.evals, [pid]: { ...j.evals[pid], ...patch } } }));
  const move = (i, d) => update((j) => { const o = [...j.finalistOrder]; const [x] = o.splice(i, 1); o.splice(i + d, 0, x); return { ...j, finalistOrder: o }; });
  const remove = (p) => { update((j) => ({ ...j, finalistOrder: j.finalistOrder.filter((x) => x !== p.id) })); decide(`Removeu “${p.title}” dos finalistas`, "Finalistas"); toast("Removido dos finalistas. O caminho continua ativo em Caminhos."); };
  const create = () => {
    const blocks = buildBlocks(job, finalists);
    const pres = { id: newId("pres"), name: `Apresentação ${job.presentations.length + 1}`, version: 1, createdAt: nowLabel(), finalists: finalists.map((p) => p.title), blocks, selected: blocks[0].id };
    update((j) => ({ ...j, presentations: [...j.presentations, pres], currentPres: pres.id }));
    decide(`Criou “${pres.name}” com ${finalists.map((p) => p.title).join(" e ")}`, "Apresentação");
    logAI(`Rascunhou ${blocks.length} blocos para “${pres.name}”`, "Apresentação");
    setConfirm(false);
    go("presentation");
  };
  if (!finalists.length) {
    return (
      <div className="content-inner">
        <PageHead title="Finalistas" />
        <div className="card"><EmptyState icon="star" title="Nenhum finalista selecionado" action={<Button variant="primary" iconRight="arrowRight" onClick={() => go("paths")}>Ir para Caminhos criativos</Button>}>Marque um ou mais caminhos como finalistas. Nenhum caminho é escolhido automaticamente.</EmptyState></div>
      </div>
    );
  }
  return (
    <div className="content-inner">
      <PageHead
        eyebrow={`${finalists.length} ${finalists.length === 1 ? "finalista selecionado" : "finalistas selecionados"} por você`}
        title="Finalistas"
        lede="Avalie lado a lado. As notas e comentários são seus e vão para a apresentação como argumento."
        actions={<Button variant="primary" icon="monitor" onClick={() => setConfirm(true)}>Criar apresentação</Button>}
      />
      <div className="table-wrap">
        <table className="cmp">
          <thead>
            <tr>
              <th scope="col"><span className="sr-only">Critério</span></th>
              {finalists.map((p, i) => (
                <th key={p.id} scope="col" style={{ minWidth: 280 }}>
                  <div className="stack" style={{ gap: 8 }}>

              ))}

                {finalists.map((p) => <td key={p.id}><ScoreControl label={`${c.label} de ${p.title}`} value={(job.evals[p.id] || {})[c.id]} onChange={(n) => setEval(p.id, { [c.id]: n })} /></td>)}
              </tr>
            ))}
            <tr>
              <th scope="row">Riscos</th>
              {finalists.map((p) => <td key={p.id}><label className="sr-only" htmlFor={"risk-" + p.id}>Riscos de {p.title}</label><textarea id={"risk-" + p.id} className="textarea" rows={3} value={(job.evals[p.id] || {}).risks || ""} onChange={(e) => setEval(p.id, { risks: e.target.value })} /></td>)}
            </tr>
            <tr>
              <th scope="row">Comentário do criativo</th>
              {finalists.map((p) => <td key={p.id}><label className="sr-only" htmlFor={"com-" + p.id}>Comentário sobre {p.title}</label><textarea id={"com-" + p.id} className="textarea" rows={3} placeholder="Por que este caminho merece ir para a apresentação?" value={(job.evals[p.id] || {}).comment || ""} onChange={(e) => setEval(p.id, { comment: e.target.value })} /></td>)}
            </tr>
          </tbody>
        </table>
      </div>
      <div className="card card-pad stack">
        <div className="between">
          <label htmlFor="rec" className="label" style={{ fontSize: 15 }}>Recomendação</label>
          {job.recommendation.author === "ai" ? <OriginBadge origin="ai" label="Rascunho da IA · edite antes de apresentar" /> : <EditedBadge />}
        </div>
        <textarea id="rec" className="textarea" rows={3} value={job.recommendation.text} onChange={(e) => update((j) => ({ ...j, recommendation: { text: e.target.value, author: "user" } }))} />
        <p className="hint">A ordem dos finalistas acima define a ordem dos caminhos na apresentação.</p>
      </div>
      {confirm && (
        <Modal title="Confirmar apresentação" onClose={() => setConfirm(false)} footer={<>
          <Button variant="secondary" onClick={() => setConfirm(false)}>Voltar</Button>
          <Button variant="primary" icon="monitor" onClick={create}>Criar apresentação</Button>
        </>}>
          <p>Estes finalistas entram na apresentação, nesta ordem:</p>
          <ol className="stack" style={{ margin: 0, paddingLeft: 20 }}>
            {finalists.map((p) => <li key={p.id}><strong>{p.title}</strong> <span className="muted small">· {p.source}</span></li>)}
          </ol>
          <Alert tone="info" icon="sparkles">A IA vai rascunhar os blocos de texto a partir das suas decisões. Você revisa e edita tudo antes de usar. Nada é enviado ao cliente.</Alert>
        </Modal>
      )}
    </div>
  );
}

const REWRITES = {
  b1: ["Brisa é um chá gaseificado sem álcool, em lata, que chega no verão. O desafio: fazer dela a escolha desejada de quem quer estar no ritual sem beber álcool.", "Como fazer um chá sem álcool ser a bebida mais desejada da noite? Esse é o desafio de Brisa no próximo verão."],
  b2: ["Capitais, noite, amigos e digital, sem moralismo. Quem não bebe não quer ser exceção nem dar explicação.", "O briefing é claro sobre onde e quando. O que ele não diz em voz alta: a pessoa que não bebe cansou de justificar a escolha."],
  b3: ["Quero fazer uma escolha melhor sem precisar explicá-la. Todo mundo quer pertencer, e o ritual é o atalho.", "“Quero fazer uma escolha melhor sem precisar explicá-la.” Na mesa, o copo diferente vira pergunta. Brisa tira a pergunta da mesa."],
  b4: ["Presença, não ausência. Brisa entra no brinde e na foto sem virar assunto.", "A oportunidade é mudar o ponto de vista: não é sobre o que falta no copo, é sobre quem continua na roda."],
  b7: ["Os dois caminhos resolvem a mesma tensão. Recomendamos seguir com o primeiro e usar o segundo para desdobramentos digitais.", "Um caminho é mais corajoso, o outro mais flexível. Nossa recomendação é começar pelo corajoso e sustentar a campanha com o flexível."],
};
function proposeRewrite(block, instruction, attempt) {
  const ins = instruction.toLowerCase();
  const sentences = block.body.split(/(?<=[.!?”])\s+/);
  if (ins.includes("curt") || ins.includes("resum") || ins.includes("enxug")) return sentences.slice(0, Math.max(1, Math.ceil(sentences.length / 2))).join(" ");
  const alts = REWRITES[block.baseId];
  if (alts) return alts[attempt % alts.length];
  if (ins.includes("client") || ins.includes("diret")) return "Em uma frase: " + sentences[0];
  return sentences.length > 1 ? sentences.slice(1).join(" ") + " " + sentences[0] : "Em resumo: " + block.body;
}
function RewriteModal({ block, onApply, onClose }) {
  const [phase, setPhase] = useState("input");
  const [ins, setIns] = useState("");
  const [attempt, setAttempt] = useState(0);
  const [proposal, setProposal] = useState("");
  const generate = (a) => {
    setPhase("loading");
    setTimeout(() => { setProposal(proposeRewrite(block, ins, a)); setPhase("preview"); }, 1200);
  };
  const chips = ["Deixe mais curto", "Tom mais leve", "Mais direto para o cliente", "Termine com uma frase de efeito"];
  if (phase === "loading") {
    return (
      <Modal title="Reescrever bloco" eyebrow={block.title} dismissible={false} onClose={() => {}}>
        <div className="row" style={{ gap: 12 }}><span className="spinner" aria-hidden="true" /><span aria-live="polite">Escrevendo uma proposta a partir da sua instrução…</span></div>
        <p className="hint">Processamento simulado. O texto atual não muda até você aplicar.</p>
      </Modal>
    );
  }
  if (phase === "preview") {
    return (
      <Modal wide title="Reescrever bloco" eyebrow={block.title} onClose={onClose} footer={<>
        <Button variant="tertiary" onClick={onClose}>Descartar proposta</Button>
        <Button variant="secondary" icon="refresh" onClick={() => { const a = attempt + 1; setAttempt(a); generate(a); }}>Gerar outra proposta</Button>
        <Button variant="primary" icon="check" onClick={() => onApply(proposal, ins)}>Aplicar como nova versão</Button>
      </>}>
        <p className="small muted">Instrução: “{ins}”</p>
        <div className="proposal-grid">
          <div className="proposal-col"><span className="eyebrow">Versão atual</span><p>{block.body}</p></div>
          <div className="proposal-col ai"><OriginBadge origin="ai" label="Proposta da IA" /><p>{proposal}</p></div>
        </div>
        <p className="hint">Aplicar cria uma nova versão do bloco. A versão atual fica no histórico.</p>
      </Modal>
    );
  }
  return (
    <Modal title="Reescrever bloco" eyebrow={block.title} onClose={onClose} footer={<>
      <Button variant="secondary" onClick={onClose}>Cancelar</Button>
      <Button variant="ai" icon="sparkles" reason={ins.trim() ? null : "Escreva uma instrução para a IA"} onClick={() => generate(attempt)}>Gerar proposta</Button>
    </>}>
      <div className="field">
        <label htmlFor="rw-ins">O que você quer mudar?</label>
        <textarea id="rw-ins" className="textarea" rows={3} value={ins} placeholder="Ex.: deixe mais curto e mais direto para o cliente" onChange={(e) => setIns(e.target.value)} />
      </div>
      <div className="row">{chips.map((c) => <button key={c} type="button" className="chip-btn" onClick={() => setIns(c)}>{c}</button>)}</div>
      <p className="hint">Você vai ver a proposta ao lado do texto atual antes de decidir.</p>
    </Modal>
  );
}
function authorBadge(b) {
  if (b.author === "user") return <Badge tone="edited" icon="user">Escrito por você</Badge>;
  if (b.author === "ai-applied") return <Badge tone="ai" icon="sparkles">Reescrito com IA · aplicado por você</Badge>;
  return <OriginBadge origin="ai" label="Gerado com IA" />;
}
function PresentationScreen({ job, update, go, toast, decide, logAI, openDemo }) {
  const pres = job.presentations.find((p) => p.id === job.currentPres);
  const [draft, setDraft] = useState(null);
  const [rewrite, setRewrite] = useState(false);
  const [openVer, setOpenVer] = useState(null);
  const [hideConfirm, setHideConfirm] = useState(null);
  useEffect(() => { setDraft(null); setOpenVer(null); }, [pres && pres.selected]);
  if (!job.analyzed) return <NotStartedStage title="Apresentação" job={job} go={go} openDemo={openDemo} />;
  if (!pres) {
    return (
      <div className="content-inner">
        <PageHead title="Apresentação" />
        <div className="card"><EmptyState icon="monitor" title="Nenhuma apresentação criada" action={<Button variant="primary" iconRight="arrowRight" onClick={() => go("finalists")}>Ir para Finalistas</Button>}>A apresentação só é criada quando você confirma os finalistas. Nada é gerado automaticamente.</EmptyState></div>
      </div>
    );
  }
  const block = pres.blocks.find((b) => b.id === pres.selected) || pres.blocks[0];
  const visible = pres.blocks.filter((b) => !b.hidden);
  const setPres = (fn, what) => {
    update((j) => ({ ...j, presentations: j.presentations.map((p) => (p.id === pres.id ? { ...fn(p), version: p.version + 1 } : p)) }));
    if (what) decide(what, "Apresentação");
  };
  const select = (id) => update((j) => ({ ...j, presentations: j.presentations.map((p) => (p.id === pres.id ? { ...p, selected: id } : p)) }));
  const setBlock = (id, patch) => (p) => ({ ...p, blocks: p.blocks.map((b) => (b.id === id ? { ...b, ...patch } : b)) });
  const move = (i, d) => setPres((p) => { const bl = [...p.blocks]; const [x] = bl.splice(i, 1); bl.splice(i + d, 0, x); return { ...p, blocks: bl }; }, `Reordenou o bloco “${pres.blocks[i].title}”`);
  const duplicate = (b) => {
    const copy = { ...b, id: newId("b"), title: b.title + " (cópia)", versions: [...b.versions] };
    setPres((p) => { const i = p.blocks.findIndex((x) => x.id === b.id); const bl = [...p.blocks]; bl.splice(i + 1, 0, copy); return { ...p, blocks: bl, selected: copy.id }; }, `Duplicou o bloco “${b.title}”`);
    toast("Bloco duplicado logo abaixo do original.");
  };
  const toggleHide = (b) => { setPres(setBlock(b.id, { hidden: !b.hidden }), `${b.hidden ? "Restaurou" : "Ocultou"} o bloco “${b.title}”`); toast(b.hidden ? "Bloco restaurado na apresentação." : "Bloco oculto. Ele continua na lista e pode ser restaurado."); };
  const cur = draft || { title: block.title, body: block.body };
  const dirty = draft && (draft.title !== block.title || draft.body !== block.body);
  const saveDraft = () => {
    const n = block.versions.length + 1;
    setPres(setBlock(block.id, { title: draft.title, body: draft.body, author: "user", versions: [...block.versions, { n, label: "Editado por você", body: draft.body, author: "user" }] }), `Editou o bloco “${block.title}”`);
    setDraft(null);
    toast(`Versão ${n} do bloco salva.`);
  };
  const applyRewrite = (text, ins) => {
    const n = block.versions.length + 1;
    setPres(setBlock(block.id, { body: text, author: "ai-applied", versions: [...block.versions, { n, label: `Reescrito com IA, aplicado por você · “${ins}”`, body: text, author: "ai-applied" }] }), `Aplicou uma reescrita da IA no bloco “${block.title}”`);
    logAI(`Propôs uma reescrita para “${block.title}”`, "Apresentação");
    setRewrite(false);
    setDraft(null);
    toast(`Versão ${n} aplicada. A versão anterior continua no histórico.`);
  };
  const idx = pres.blocks.findIndex((b) => b.id === block.id);
  const visIdx = visible.findIndex((b) => b.id === block.id);
  return (
    <div className="content-inner" style={{ maxWidth: 1180 }}>
      <PageHead
        eyebrow={`${pres.name} · versão ${pres.version} · criada ${pres.createdAt}`}
        title="Apresentação"
        lede="Texto estruturado para revisar e ajustar. A diagramação dos slides fica fora deste protótipo."
        actions={job.presentations.length > 1 && (
          <><label htmlFor="pres-pick" className="sr-only">Escolher apresentação</label>
          <select id="pres-pick" className="select" style={{ width: 220 }} value={pres.id} onChange={(e) => update((j) => ({ ...j, currentPres: e.target.value }))}>
            {job.presentations.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
          </select></>
        )}
      />
      <div className="pres">
        <section className="card" aria-label="Estrutura de blocos">
          <div className="between" style={{ padding: "14px 16px 6px" }}>
            <h2>Blocos</h2>
            <span className="small muted">{visible.length} de {pres.blocks.length} visíveis</span>
          </div>
          <ol className="block-list">
            {pres.blocks.map((b, i) => (
              <li key={b.id} className={`block-item${b.hidden ? " hidden-block" : ""}`} data-selected={b.id === block.id}>
                <button type="button" className="block-select" aria-current={b.id === block.id ? "true" : undefined} onClick={() => select(b.id)}>
                  <span className="pos">{i + 1}</span>
                  <span className="stack" style={{ gap: 2 }}>
                    <span className="t">{b.title}</span>
                    <span className="small muted">{b.hidden ? "Oculto" : b.author === "user" ? "Escrito por você" : b.author === "ai-applied" ? "IA · aplicado por você" : "Gerado com IA"} · v{b.versions.length}</span>
                  </span>
                </button>
                <div className="block-tools">
                  <IconButton icon="arrowUp" label={`Mover “${b.title}” para cima`} disabled={i === 0} onClick={() => move(i, -1)} />
                  <IconButton icon="arrowDown" label={`Mover “${b.title}” para baixo`} disabled={i === pres.blocks.length - 1} onClick={() => move(i, 1)} />
                  <IconButton icon="copy" label={`Duplicar “${b.title}”`} onClick={() => duplicate(b)} />
                  <IconButton icon={b.hidden ? "eye" : "eyeOff"} label={b.hidden ? `Restaurar “${b.title}”` : `Ocultar “${b.title}”`} onClick={() => (b.hidden ? toggleHide(b) : setHideConfirm(b))} />
                </div>
              </li>
            ))}
          </ol>
        </section>
        <section className="card card-pad stack-16" aria-label="Editor do bloco">
          <div className="between">
            <div className="badges">{authorBadge(block)}{block.hidden && <Badge tone="discard" icon="eyeOff">Oculto na apresentação</Badge>}</div>
            <Button size="sm" variant="ai" icon="sparkles" onClick={() => setRewrite(true)}>Reescrever com IA</Button>
          </div>
          <div className="field">
            <label htmlFor="blk-title">Título do bloco</label>
            <input id="blk-title" className="input" value={cur.title} onChange={(e) => setDraft({ ...cur, title: e.target.value })} />
          </div>
          <div className="field">
            <label htmlFor="blk-body">Texto</label>
            <textarea id="blk-body" className="textarea" rows={9} value={cur.body} onChange={(e) => setDraft({ ...cur, body: e.target.value })} />
          </div>
          {dirty && (
            <div className="between alert alert-info" style={{ alignItems: "center" }}>
              <span>Alterações não salvas. Salvar cria a versão {block.versions.length + 1}.</span>
              <span className="row"><Button size="sm" variant="tertiary" onClick={() => setDraft(null)}>Descartar alterações</Button><Button size="sm" variant="primary" icon="check" onClick={saveDraft}>Salvar versão</Button></span>
            </div>
          )}
          <div className="stack">
            <h2 style={{ fontSize: 14 }}>Histórico do bloco · {block.versions.length} {block.versions.length === 1 ? "versão" : "versões"}</h2>
            <ul className="versions">
              {[...block.versions].reverse().map((v) => (
                <li key={v.n} className={v.n === block.versions.length ? "current" : ""}>
                  <div className="between">
                    <span className="row"><strong>v{v.n}</strong><span className="small">{v.label}</span></span>
                    {v.n === block.versions.length ? <Badge tone="edited">Atual</Badge> : <Button size="sm" variant="tertiary" icon="eye" aria-expanded={openVer === v.n} onClick={() => setOpenVer(openVer === v.n ? null : v.n)}>{openVer === v.n ? "Ocultar" : "Ver texto"}</Button>}
                  </div>
                  {openVer === v.n && <p className="prev-text">{v.body}</p>}
                </li>
              ))}
            </ul>
          </div>
        </section>
        <section className="stack-16" aria-label="Prévia do slide">
          <div className="card card-pad stack">
            <div className="between"><h2>Prévia</h2><span className="small muted">{block.hidden ? "Fora da apresentação" : `Slide ${visIdx + 1} de ${visible.length}`}</span></div>
            <div className="slide" aria-label={`Prévia do slide ${cur.title}`}>
              <span className="s-eyebrow">{job.client} · {job.name}</span>
              <span className="s-title">{cur.title}</span>
              <span className="s-body">{cur.body}</span>
              <span className="s-num">{String(idx + 1).padStart(2, "0")}</span>
              {block.hidden && <span className="s-hidden">Oculto na apresentação</span>}
            </div>
            <p className="hint">Prévia simplificada do texto. Sem diagramação final.</p>
          </div>
          <div className="card card-pad stack">
            <h2>Finalistas nesta apresentação</h2>
            {pres.finalists.map((f, i) => <span key={f} className="row small"><span className="rank" style={{ width: 22, height: 22, fontSize: 11 }}>{i + 1}</span>{f}</span>)}
          </div>
        </section>
      </div>
      {rewrite && <RewriteModal block={block} onClose={() => setRewrite(false)} onApply={applyRewrite} />}
      {hideConfirm && (
        <ConfirmDiscard what={`o bloco “${hideConfirm.title}” da apresentação`} confirmLabel="Ocultar bloco" detail="O bloco sai da apresentação, mas continua na lista de blocos com todas as versões. Você pode restaurá-lo." onClose={() => setHideConfirm(null)} onConfirm={() => { toggleHide(hideConfirm); setHideConfirm(null); }} />
      )}
    </div>
  );
}

function SummaryScreen({ job, go, toast, resetDemo }) {
  const [confirmReset, setConfirmReset] = useState(false);
  const st = stageStatus(job);
  const openQ = job.analysis.filter((i) => i.kind === "question" && i.status === "open");
  const chosen = job.combos.filter((c) => c.state === "chosen");
  const livePaths = job.paths.filter((p) => !p.discarded);
  const counts = {
    briefing: `Versão ${job.briefVersion}`,
    analysis: `${job.analysis.filter((i) => i.kind === "fact").length} fatos · ${job.analysis.filter((i) => i.kind === "hyp").length} hipóteses · ${openQ.length} dúvidas em aberto`,
    material: `${job.materials.filter((m) => !m.discarded && isUsed(m)).length} itens selecionados`,
    combos: `${chosen.length} escolhida${chosen.length === 1 ? "" : "s"} de ${job.combos.filter((c) => c.state !== "discarded").length}`,
    paths: `${livePaths.length} caminhos`,
    finalists: `${job.finalistOrder.length} finalista${job.finalistOrder.length === 1 ? "" : "s"}`,
    presentation: `${job.presentations.length} apresentaç${job.presentations.length === 1 ? "ão" : "ões"}`,
  };
  if (!job.analyzed) {
    counts.briefing = `Versão ${job.briefVersion} · rascunho`;
    STAGES.slice(1).forEach((s) => { counts[s.id] = "depende da análise"; });
  }
  const pending = [];
  if (!job.analyzed) pending.push({ text: "Análise não disponível neste protótipo para briefings novos. O job continua como rascunho.", go: "briefing" });
  openQ.forEach((q) => pending.push({ text: `Dúvida em aberto: “${q.text}”`, go: "analysis" }));
  if (!materialCheck(job.materials).ok) pending.push({ text: "A matéria prima tem requisitos pendentes.", go: "material" });
  if (job.combos.length && !chosen.length) pending.push({ text: "Nenhuma combinação escolhida.", go: "combos" });
  if (livePaths.length && !job.finalistOrder.length) pending.push({ text: "Nenhum caminho marcado como finalista.", go: "paths" });
  if (job.finalistOrder.length && !job.presentations.length) pending.push({ text: "Finalistas prontos, apresentação ainda não criada.", go: "finalists" });
  const resume = !job.analyzed ? "briefing" : st.paths === "current" || !job.paths.length ? "paths" : STAGES.find((s) => st[s.id] === "current")?.id || "paths";
  const statusText = { done: "Concluída", current: "Em andamento", todo: "Não iniciada" };
  return (
    <div className="content-inner">
      <PageHead
        eyebrow={job.demo ? "Resumo do job · demonstração com dados simulados" : "Resumo do job · rascunho"}

        actions={<>
          {job.demo && <Button variant="secondary" icon="refresh" onClick={() => setConfirmReset(true)}>Reiniciar demonstração</Button>}

        </>}
      >
        <div className="row small muted"><span>Cliente: <strong style={{ color: "var(--text)" }}>{job.client}</strong></span><span>·</span><span>Última atualização: {job.updatedAt}</span></div>
        <div style={{ maxWidth: 360 }}><ProgressBar value={jobProgress(job)} label="Progresso geral" /></div>
      </PageHead>
      <div className="split">
        <div className="stack-16">
          <section className="card card-pad stack" aria-labelledby="tl-h">
            <h2 id="tl-h">Etapas</h2>
            <ol className="timeline">
              {STAGES.map((s, i) => (
                <li key={s.id} className="tl-item">
                  <span className={`tl-dot ${st[s.id]}`} aria-hidden="true">{st[s.id] === "done" ? <Icon name="check" size={12} /> : i + 1}</span>
                  <span className="stack" style={{ gap: 2 }}>
                    <strong>{s.label}</strong>
                    <span className="small muted">{statusText[st[s.id]]} · {counts[s.id]}</span>
                  </span>
                  {st[s.id] === "done" ? <Button size="sm" variant="secondary" icon="undo" onClick={() => go(s.id)}>Reabrir</Button> : st[s.id] === "current" ? <Button size="sm" variant="primary" onClick={() => go(s.id)}>Abrir</Button> : <Button size="sm" variant="tertiary" reason="Conclua as etapas anteriores primeiro">Abrir</Button>}
                </li>
              ))}

          </section>
          <div className="grid-2">
            <section className="card card-pad stack" aria-labelledby="dec-h">
              <div className="between"><h2 id="dec-h">Suas decisões recentes</h2><HumanBadge icon="user">Você</HumanBadge></div>
              {job.decisions.length ? (
                <ul className="log">{job.decisions.slice(0, 6).map((d, i) => <li key={i}><span className="log-icon human"><Icon name="check" size={13} /></span><span className="stack" style={{ gap: 0 }}><span>{d.text}</span><span className="small muted">{d.stage} · {d.at}</span></span></li>)}</ul>
              ) : <p className="small muted">Nenhuma decisão registrada ainda.</p>}
            </section>
            <section className="card card-pad stack" aria-labelledby="ai-h">
              <div className="between"><h2 id="ai-h">Atividade da IA</h2><OriginBadge origin="ai" label="IA" /></div>
              {job.aiLog.length ? (
                <ul className="log">{job.aiLog.slice(0, 6).map((d, i) => <li key={i}><span className="log-icon ai"><Icon name="sparkles" size={13} /></span><span className="stack" style={{ gap: 0 }}><span>{d.text}</span><span className="small muted">{d.stage} · {d.at}</span></span></li>)}</ul>
              ) : <p className="small muted">Nenhuma atividade da IA ainda.</p>}
              <p className="hint">A IA propõe e gera. Nenhuma entrada aqui é uma decisão.</p>
            </section>
          </div>
        </div>
        <aside className="sticky-col">
          <section className="card card-pad stack" aria-labelledby="pend-h">
            <h2 id="pend-h">Pendências</h2>
            {pending.length ? pending.map((p, i) => (
              <div key={i} className="between alert alert-warn" style={{ alignItems: "center" }}>
                <span className="row" style={{ flexWrap: "nowrap", alignItems: "flex-start" }}><Icon name="alert" size={16} /><span>{p.text}</span></span>
                <Button size="sm" variant="tertiary" onClick={() => go(p.go)}>Ver</Button>
              </div>
            )) : <Alert tone="ok">Nada pendente.</Alert>}
          </section>
          <section className="card card-pad stack" aria-labelledby="pres-h">
            <h2 id="pres-h">Apresentações</h2>
            {job.presentations.length ? job.presentations.map((p) => (
              <div key={p.id} className="between chip">
                <span className="stack" style={{ gap: 0 }}><strong>{p.name}</strong><span className="small muted">Versão {p.version} · {p.blocks.filter((b) => !b.hidden).length} blocos · {p.createdAt}</span></span>
                <Button size="sm" variant="secondary" onClick={() => go("presentation")}>Abrir</Button>
              </div>
            )) : <p className="small muted">Nenhuma apresentação ainda. Ela é criada a partir dos finalistas, com a sua confirmação.</p>}
          </section>
        </aside>
      </div>
      {confirmReset && (
        <Modal title="Reiniciar demonstração" onClose={() => setConfirmReset(false)} footer={<>
          <Button variant="secondary" onClick={() => setConfirmReset(false)}>Cancelar</Button>
          <Button variant="danger" icon="refresh" onClick={() => { resetDemo(); setConfirmReset(false); toast("Demonstração Brisa reiniciada do início."); }}>Reiniciar</Button>
        </>}>
          <p>A demonstração Brisa volta ao começo: análise sem confirmações, matéria prima sem seleção, nenhuma combinação escolhida e nenhum caminho gerado.</p>
          <Alert tone="info">Só a demonstração muda. Seus rascunhos continuam como estão.</Alert>
        </Modal>
      )}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* App                                                                 */
/* ------------------------------------------------------------------ */
function App() {
  const [screen, setScreen] = useState("jobs");
  // Every job is its own object, keyed by id. Brisa is the only demonstration job.
  const [jobs, setJobs] = useState(() => ({ brisa: makeJob(true) }));
  const [order, setOrder] = useState(["brisa"]);
  const [activeId, setActiveId] = useState("brisa");
  const [toasts, setToasts] = useState([]);
  const [legend, setLegend] = useState(false);
  const [form, setForm] = useState({ ...EMPTY_FORM, files: [] });
  const job = jobs[activeId] || jobs.brisa;
  const jobId = job.id;
  const inJob = !["jobs", "new"].includes(screen);

  const go = (s) => { setScreen(s); window.scrollTo(0, 0); };
  const toast = (text, tone = "ok") => {
    const id = Date.now() + Math.random();
    setToasts((t) => [...t, { id, text, tone }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 4200);
  };
  // All writes name the job they belong to. Nothing writes to "the current job" implicitly.
  const updateJob = (id, fn) => setJobs((js) => (js[id] ? { ...js, [id]: { ...fn(js[id]), id, updatedAt: nowLabel() } } : js));
  const update = (fn) => updateJob(jobId, fn);
  const decide = (text, stage) => updateJob(jobId, (j) => ({ ...j, decisions: [{ text, stage, at: nowLabel() }, ...j.decisions] }));
  const logAI = (text, stage) => updateJob(jobId, (j) => ({ ...j, aiLog: [{ text, stage, at: nowLabel() }, ...j.aiLog] }));

  const openJob = (id, s = "summary") => { setActiveId(id); go(s); };
  const createDraft = (f) => {
    const d = makeDraftJob(f);
    setJobs((js) => ({ ...js, [d.id]: d }));
    setOrder((o) => [d.id, ...o]);
    setActiveId(d.id);
    setForm({ ...EMPTY_FORM, files: [] });
    return d.id;
  };
  const saveDraft = (id, f) => updateJob(id, (j) => ({ ...j, name: f.name.trim(), client: f.client.trim(), brief: f.brief, files: f.files.map((x) => ({ ...x })), decisions: [{ text: "Salvou alterações no briefing", stage: "Briefing", at: nowLabel() }, ...j.decisions] }));
  const deleteDraft = (id) => {
    if (id === "brisa") return;
    setOrder((o) => o.filter((x) => x !== id));
    setJobs((js) => { const n = { ...js }; delete n[id]; return n; });
    if (activeId === id) setActiveId("brisa");
  };
  const openDemo = (fromName) => {
    openJob("brisa");
    toast(fromName ? `Demonstração Brisa aberta. O rascunho “${fromName}” continua separado em Jobs.` : "Demonstração Brisa aberta.");
  };
  const resetDemo = () => setJobs((js) => ({ ...js, brisa: { ...makeJob(false), decisions: [{ text: "Reiniciou a demonstração do início", stage: "Resumo", at: nowLabel() }] } }));

  const props = { job, update, go, toast, decide, logAI, openDemo };
  let body;
  switch (screen) {
    case "jobs": body = <JobsScreen jobsList={order.map((id) => jobs[id]).filter(Boolean)} go={go} openJob={openJob} deleteDraft={deleteDraft} toast={toast} />; break;
    case "new": body = <NewJobScreen mode="new" job={null} form={form} setForm={setForm} go={go} toast={toast} createDraft={createDraft} saveDraft={saveDraft} openDemo={openDemo} onReanalyzed={() => {}} />; break;
    case "briefing": body = <BriefingWrap key={job.id} job={job} go={go} toast={toast} createDraft={createDraft} saveDraft={saveDraft} openDemo={openDemo} onReanalyzed={() => { logAI("Reanalisou o briefing (resultado simulado)", "Análise"); go("analysis"); }} />; break;
    case "summary": body = <SummaryScreen job={job} go={go} toast={toast} resetDemo={resetDemo} />; break;
    case "analysis": body = <AnalysisScreen {...props} />; break;
    case "material": body = <MaterialScreen {...props} />; break;
    case "combos": body = <CombosScreen {...props} />; break;
    case "paths": body = <PathsScreen {...props} />; break;
    case "finalists": body = <FinalistsScreen {...props} />; break;
    case "presentation": body = <PresentationScreen {...props} />; break;
    default: body = null;
  }
  return (
    <div className="app">
      <Sidebar screen={screen} go={go} job={job} inJob={inJob} />
      <div className="main">
        <TopBar screen={screen} go={go} job={job} inJob={inJob} openLegend={() => setLegend(true)} />
        <main className="content" id="main" key={job.id + ":" + screen}>{body}</main>
      </div>
      <Toasts toasts={toasts} dismiss={(id) => setToasts((t) => t.filter((x) => x.id !== id))} />
      {legend && <LegendPanel onClose={() => setLegend(false)} />}
    </div>
  );
}
function BriefingWrap({ job, ...rest }) {
  const [form, setForm] = useState({ name: job.name, client: job.client, brief: job.brief, files: job.files.map((f) => ({ ...f })) });
  return <NewJobScreen mode="briefing" job={job} form={form} setForm={setForm} {...rest} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
