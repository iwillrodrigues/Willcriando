name: S3 migration (willcriando dev)

# Manual only. Applies migration 20261002120000_s3_dismissal_versions_deletion.sql
# from commit 476377b3ed19c168ea95326ac2e1c64d79df094c to the Supabase
# development project willcriando (ref anhaonrifwakoekksopv) with the official
# Supabase CLI (`supabase db push`), once, then validates it and runs the S1, S2
# and S3 pgTAP suites, each in a transaction that rolls back.
#
# Secret (store it in the "willcriando-dev" environment only): SUPABASE_DB_URL,
# exactly postgresql://postgres.anhaonrifwakoekksopv:<password>@aws-<n>-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require
# It is given only to the steps that connect, and never printed.
#
# Every gate fails closed. Nothing is retried, repaired or registered by hand.
# No deployment happens here.
#
# GitHub dispatches workflow_dispatch only for workflows whose file exists on
# the default branch. Until this reviewed file is there, it cannot be started.

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: "Type the target project ref (anhaonrifwakoekksopv) to allow the write"
        required: true

permissions:
  contents: read

# One migration run at a time against this project; a second run waits.
concurrency:
  group: supabase-migration-anhaonrifwakoekksopv
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_REF: anhaonrifwakoekksopv
  SUPABASE_CLI_VERSION: 2.119.0
  PGSSLMODE: require
  # Read by the pinned CLI before any telemetry call; the telemetry step also
  # disables it in the CLI settings and verifies both.
  SUPABASE_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  migrate:
    runs-on: ubuntu-24.04
    # Above the sum of the step timeouts (69 min), so a step limit always fires first.
    timeout-minutes: 80
    environment: willcriando-dev
    steps:
      - name: Confirm target
        env:
          CONFIRM: ${{ inputs.confirm_project_ref }}
        run: |
          if [ "$CONFIRM" != "$EXPECTED_PROJECT_REF" ]; then
            echo "::error title=Not confirmed::confirm_project_ref must be exactly $EXPECTED_PROJECT_REF."
            exit 1
          fi

      # v4.4.0, the commit the v4 tag points to (releases-v4 line, node20).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        timeout-minutes: 3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source
        timeout-minutes: 2
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: bash .github/scripts/s3-migration/run.sh source

      - name: Self-test the connection string check (offline, no secret)
        timeout-minutes: 2
        run: python3 .github/scripts/s3-migration/test_check_db_url.py

      - name: Verify target secret
        timeout-minutes: 2
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash .github/scripts/s3-migration/run.sh target

      # Replaces supabase/setup-cli, which runs the CLI before it can be checked.
      # Downloads the pinned release archive and verifies its SHA-256, contents
      # and both binaries against values committed in run.sh. No secret here, and
      # nothing executes the CLI until this step has succeeded; every later call
      # re-verifies the binaries and runs them by absolute path.
      - name: Install and verify Supabase CLI
        timeout-minutes: 4
        run: bash .github/scripts/s3-migration/run.sh install-cli

      # Three CLI calls at 30 s plus 5 s to SIGKILL = 105 s, plus three integrity
      # guards and shell work (under 10 s): at most about 115 s of 180 s.
      - name: Disable and verify CLI telemetry
        timeout-minutes: 3
        run: bash .github/scripts/s3-migration/run.sh telemetry

      # Every read capped: at most about 510 s of 660 s (arithmetic in run.sh preflight).
      - name: Preflight (read-only)
        timeout-minutes: 11
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash .github/scripts/s3-migration/run.sh preflight

      # The only write. Runs once (client timeout 600 s, then killed); a failure,
      # timeout or kill is classified below, never retried.
      - name: Apply S3 migration (supabase db push, once)
        id: apply
        timeout-minutes: 12
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash .github/scripts/s3-migration/run.sh apply

      # Runs whenever the push may have started, including after a step timeout
      # or cancellation. Waits at most 240 s for a stable answer.
      - name: Classify result (read-only)
        if: always() && (steps.apply.outputs.attempted == 'true' || steps.apply.outcome == 'failure' || steps.apply.outcome == 'cancelled')
        timeout-minutes: 7
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PUSH_EXIT_CODE: ${{ steps.apply.outputs.exit_code }}
        run: bash .github/scripts/s3-migration/run.sh classify

      - name: Validate schema and records (read-only)
        timeout-minutes: 4
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash .github/scripts/s3-migration/run.sh validate

      - name: S1, S2 and S3 pgTAP suites (rolled back)
        timeout-minutes: 18
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash .github/scripts/s3-migration/run.sh tests

      - name: Summary
        if: always()
        timeout-minutes: 1
        env:
          JOB_STATUS: ${{ job.status }}
          COMMIT: ${{ github.sha }}
        run: |
          {
            echo "## S3 migration: $JOB_STATUS"
            echo
            echo "Target: \`$EXPECTED_PROJECT_REF\` (willcriando, development). Commit: \`$COMMIT\`."
            echo
            cat "$RUNNER_TEMP/s3-migration/report.md" 2>/dev/null || echo "- No step reached the database."
            if [ "$JOB_STATUS" != "success" ]; then
              echo
              echo "**Stopped.** See the first FAILED line. Nothing was retried or repaired."
            fi
          } >>"$GITHUB_STEP_SUMMARY"
